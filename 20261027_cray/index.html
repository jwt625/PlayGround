<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patent Figures</title>
<style>
:root {
  --surface-0: #f6f5f2; --surface-1: #fcfcfb; --surface-2: #efeee9; --border: #dddcd6;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #75736c;
  --series-1: #2a78d6; --series-2: #eb6834; --context: #b9b7ae;
  --ink: #2b2b29; --hi: #2a78d6; --hi-fill: rgba(42, 120, 214, .14); --mark: rgba(237, 161, 0, .35);
  --scan-filter: none; --note-bar: #eb6834;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --surface-0: #121211; --surface-1: #1a1a19; --surface-2: #232321; --border: #34342f;
    --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #918f85;
    --series-1: #3987e5; --series-2: #d95926; --context: #6b6a63;
    --ink: #d6d5cc; --hi: #4c9bf0; --hi-fill: rgba(57, 135, 229, .22); --mark: rgba(201, 133, 0, .45);
    --scan-filter: invert(1) brightness(.86); --note-bar: #d95926;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --surface-0: #121211; --surface-1: #1a1a19; --surface-2: #232321; --border: #34342f;
  --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #918f85;
  --series-1: #3987e5; --series-2: #d95926; --context: #6b6a63;
  --ink: #d6d5cc; --hi: #4c9bf0; --hi-fill: rgba(57, 135, 229, .22); --mark: rgba(201, 133, 0, .45);
  --scan-filter: invert(1) brightness(.86); --note-bar: #d95926;
  color-scheme: dark;
}
* { box-sizing: border-box; border-radius: 0 !important; }
html, body { margin: 0; height: 100%; background: var(--surface-0); color: var(--text-primary);
  font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
body { overflow: hidden; }
a { color: var(--series-1); text-decoration: none; }
button, input, select { font: inherit; color: var(--text-primary); }
button { background: var(--surface-1); border: 1px solid var(--border); padding: 3px 9px; cursor: pointer; white-space: nowrap; }
button:hover { background: var(--surface-2); }
button.on { background: var(--hi); border-color: var(--hi); color: #fff; }
button:disabled { opacity: .4; cursor: default; }
.mono, .num { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
.lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); }
.spacer { flex: 1; }
.grp { display: inline-flex; }
.grp button + button { border-left: 0; }

#app { display: grid; grid-template-rows: 40px minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); height: 100vh; }
#bar { display: flex; align-items: center; gap: 12px; padding: 0 12px; background: var(--surface-1); border-bottom: 1px solid var(--border); min-width: 0; }
#home { color: var(--text-secondary); font-weight: 600; }
#crumb { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-secondary); }
#crumb .num { color: var(--text-primary); margin-right: 8px; }
#tabs { display: flex; height: 100%; }
#tabs a { display: flex; align-items: center; padding: 0 12px; color: var(--text-secondary); border-bottom: 2px solid transparent; }
#tabs a.on { color: var(--text-primary); border-bottom-color: var(--hi); }
#main { min-height: 0; overflow: hidden; }

/* gallery */
.gallery { height: 100%; overflow-y: auto; padding: 0 24px 24px; }
.gbar { position: sticky; top: 0; z-index: 3; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; max-width: 1240px; margin: 0 auto; padding: 12px 0 8px; background: var(--surface-0); }
.gbar input { flex: 0 1 420px; min-width: 0; height: 30px; padding: 3px 8px; background: var(--surface-1); border: 1px solid var(--border); }
.gbar select { height: 30px; background: var(--surface-1); border: 1px solid var(--border); padding: 2px 4px; }
.gbar button { height: 30px; }
.gfacets { display: grid; gap: 6px; max-width: 1240px; margin: 0 auto 20px; }
.frow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.frow > .lbl { width: 72px; flex: none; }
.fchip { padding: 1px 8px; font-size: 12px; color: var(--text-secondary); }
.fchip .num { color: var(--text-muted); margin-left: 4px; }
.fchip.on, .fchip.on .num { color: #fff; }
.gnone { max-width: 1240px; margin: 24px auto; }
.unk { color: var(--context); }
.gtable .st { white-space: nowrap; }
.pl { color: var(--text-muted); }
.gtable { max-width: 1240px; margin: 0 auto; overflow-x: auto; border: 1px solid var(--border); background: var(--surface-1); }
.gtable table { border-collapse: collapse; width: 100%; font-size: 13px; }
.gtable th { position: sticky; top: 0; background: var(--surface-1); text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); padding: 6px 8px; border-bottom: 1px solid var(--border); cursor: pointer; white-space: nowrap; user-select: none; }
.gtable th.on { color: var(--text-primary); }
.gtable th.r, .gtable td.r { text-align: right; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
.gtable td { padding: 4px 8px; border-bottom: 1px solid var(--border); color: var(--text-secondary); vertical-align: top; }
.gtable td.tt { color: var(--text-primary); min-width: 220px; }
.gtable td.num { white-space: nowrap; }
.gtable tbody tr { cursor: pointer; }
.gtable tbody tr:hover td { background: var(--hi-fill); }
#tip .tthumb { display: block; width: 220px; filter: var(--scan-filter); margin-bottom: 4px; }
#tip .tmeta { margin-bottom: 2px; }
#tip .pl { margin-left: 4px; }
.ghead { grid-column: 1 / -1; margin-bottom: -12px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-secondary); }
.cards + .cards { margin-top: 36px; }
.gout { padding-bottom: 24px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 520px)); justify-content: center; gap: 24px; max-width: 1240px; margin: 0 auto; }
.card { display: grid; grid-template-rows: 360px auto; background: var(--surface-1); border: 1px solid var(--border); cursor: pointer; color: inherit; }
.card:hover { border-color: var(--hi); }
.card .thumb { overflow: hidden; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: center; padding: 12px; background: var(--surface-0); }
.card .thumb svg, .card .thumb img { width: 100%; height: 100%; }
.card .meta { padding: 12px 14px 14px; display: grid; gap: 6px; }
.card .t { font-size: 16px; font-weight: 600; }
.card .row { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--text-secondary); font-size: 13px; }
.card .counts { color: var(--text-muted); font-size: 12px; }

/* figures tab */
.figs { display: grid; grid-template-columns: 200px minmax(0, 1fr) 360px; height: 100%; }
.flist { overflow-y: auto; border-right: 1px solid var(--border); background: var(--surface-1); }
.fitem { display: grid; grid-template-columns: 56px 1fr; gap: 8px; align-items: center; padding: 6px 10px; cursor: pointer; border-bottom: 1px solid var(--border); }
.fitem:hover { background: var(--surface-2); }
.fitem.on { background: var(--surface-2); box-shadow: inset 3px 0 var(--hi); }
.fitem img { width: 56px; height: 56px; object-fit: contain; background: #fff; filter: var(--scan-filter); }
.fitem .fl { font-weight: 600; }
.fitem .fs { font-size: 11px; color: var(--text-muted); }
.center { display: grid; grid-template-rows: auto 1fr; min-width: 0; min-height: 0; }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 6px 10px; border-bottom: 1px solid var(--border); background: var(--surface-1); }
.tools .lbl { margin-right: -6px; }
.tools input[type=range] { width: 160px; accent-color: var(--hi); }
.stepv { min-width: 9ch; color: var(--text-secondary); }
.side { border-left: 1px solid var(--border); background: var(--surface-1); display: grid; grid-template-rows: minmax(0, 1.3fr) minmax(0, 1fr); min-height: 0; }
.info { overflow-y: auto; padding: 12px 14px; border-bottom: 1px solid var(--border); }
.info h2 { margin: 0 0 8px; font-size: 16px; display: flex; align-items: baseline; gap: 8px; }
.info h2 .num { color: var(--hi); }
.info .alt { color: var(--text-muted); font-size: 12px; margin: -4px 0 8px; }
.quote { margin: 0 0 10px; padding: 0 0 0 10px; border-left: 2px solid var(--context); color: var(--text-primary); }
.cite { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: var(--text-muted); cursor: pointer; white-space: nowrap; }
.cite:hover { color: var(--hi); }
.note { margin: 0 0 10px; padding: 6px 10px; border-left: 2px solid var(--note-bar); background: var(--surface-2); color: var(--text-secondary); font-size: 13px; }
.note .lbl { display: block; margin-bottom: 2px; }
.sub { margin: 12px 0 4px; }
.mlist { display: grid; gap: 6px; }
.mitem { font-size: 13px; cursor: pointer; padding: 2px 0; }
.mitem:hover { color: var(--hi); }
.mitem b { color: var(--hi); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.chip { border: 1px solid var(--border); padding: 0 6px; font-size: 12px; cursor: pointer; background: var(--surface-0); }
.chip:hover, .chip.on { border-color: var(--hi); color: var(--hi); }
.plist { overflow-y: auto; }
.plist .head { position: sticky; top: 0; background: var(--surface-1); padding: 6px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
.prow { display: grid; grid-template-columns: 48px 1fr; gap: 8px; padding: 3px 14px; cursor: pointer; font-size: 13px; }
.prow:hover, .prow.on { background: var(--surface-2); }
.prow.on { box-shadow: inset 3px 0 var(--hi); }
.prow .num { color: var(--text-secondary); text-align: right; }

/* figure view */
.fv { position: relative; overflow: hidden; min-height: 0; background: var(--surface-0); touch-action: none; }
.fv svg.stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; user-select: none; }
.fv.panning svg.stage { cursor: grabbing; }
.fv .scan { filter: var(--scan-filter); }
.fv .tr-s { stroke: var(--ink); fill: none; stroke-linecap: round; stroke-linejoin: round; }
.fv .tr-fill-solid { fill: var(--ink); }
.fv .tr-fill-light { fill: var(--ink); fill-opacity: .08; }
.fv .tr-arrow { fill: var(--ink); }
.fv .tr-hatchline { stroke: var(--ink); stroke-width: 2; }
.fv .tr-fill-paper { fill: var(--surface-0); }
.fv .tr-ink-paper.tr-s, .fv .tr-el.on .tr-ink-paper.tr-s { stroke: var(--surface-0); }
.fv .tr-t.tr-ink-paper, .fv .tr-el.on .tr-t.tr-ink-paper { fill: var(--surface-0); }
.fv .tr-t { fill: var(--ink); font-family: Helvetica, Arial, ui-sans-serif, sans-serif; }
.fv .tr-it { font-style: italic; }
.fv .tr-b { font-weight: 700; }
.fv .tr-k-label .tr-t { fill: var(--text-secondary); }
.fv .tr-el { transition: opacity .12s; }
.fv.m-trace .scan { display: none; }
.fv.m-scan .tr-el { opacity: 0; }
.fv.m-overlay .scan { opacity: .55; }
.fv.m-overlay .tr-s, .fv.m-overlay .tr-arrow { stroke: var(--hi); }
.fv.m-overlay .tr-t, .fv.m-overlay .tr-fill-solid, .fv.m-overlay .tr-arrow { fill: var(--hi); }
.fv.sel .tr-el { opacity: .3; }
.fv.m-scan.sel .tr-el { opacity: 0; }
.fv .tr-el.on { opacity: 1 !important; }
.fv .tr-el.on .tr-s { stroke: var(--hi); }
.fv .tr-el.on .tr-t, .fv .tr-el.on .tr-fill-solid, .fv .tr-el.on .tr-arrow { fill: var(--hi); }
.fv .tr-el.on.tr-k-block .tr-s:not(polyline):not(.tr-fill-solid) { fill: var(--hi-fill); }
.fv .tr-el.fut { opacity: .08; }
.fv .tr-el.now .tr-s { stroke: var(--series-2); }
.fv .tr-el.now .tr-t, .fv .tr-el.now .tr-fill-solid { fill: var(--series-2); }
.fv .hit * { fill: transparent; stroke: transparent; }
.fv .hit [data-ref] { cursor: pointer; }
.fv .fvTag { position: absolute; left: 8px; top: 6px; color: var(--text-muted); font-size: 11px; pointer-events: none; }
.fv .fvZoom { position: absolute; right: 8px; bottom: 6px; color: var(--text-muted); font-size: 11px; pointer-events: none; }
.fv .fvFull { position: absolute; right: 8px; top: 6px; }

/* text + claims tab */
.textv { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 44%); height: 100%; }
.tcol { overflow-y: auto; border-right: 1px solid var(--border); }
.tbar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 6px 16px; background: var(--surface-1); border-bottom: 1px solid var(--border); }
.tbar input { width: 260px; padding: 3px 8px; background: var(--surface-0); border: 1px solid var(--border); }
.tbar select { background: var(--surface-0); border: 1px solid var(--border); padding: 2px 4px; max-width: 280px; }
.tbody { max-width: 820px; padding: 8px 16px 64px; }
.tsec { margin: 22px 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); font-weight: 600; }
.para { display: grid; grid-template-columns: 48px 1fr; gap: 10px; margin: 0 0 10px; }
.para .cite { text-align: right; padding-top: 3px; }
.para.flash { background: var(--mark); }
.para p { margin: 0; }
.para table { border-collapse: collapse; font-size: 12px; }
.para td { border: 1px solid var(--border); padding: 2px 6px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
a.rf { color: var(--hi); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .92em; border-bottom: 1px dotted var(--hi); }
a.rf.on { background: var(--hi-fill); }
a.fg { color: var(--series-1); border-bottom: 1px solid transparent; }
a.fg:hover { border-bottom-color: var(--series-1); }
mark { background: var(--mark); color: inherit; }
.claim { margin: 0 0 12px; }
.claim.dep { margin-left: 24px; }
.claim p { margin: 0; white-space: pre-line; }
.pane { display: grid; grid-template-rows: auto 1fr; min-height: 0; }
.pane .tools { gap: 8px; }
.pane .fv { height: 100%; }

/* about */
.about { height: 100%; overflow-y: auto; padding: 16px 24px 64px; }
.about .wrap { max-width: 900px; }
.about h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); margin: 22px 0 8px; }
.about table { border-collapse: collapse; width: 100%; font-size: 13px; }
.about td, .about th { text-align: left; padding: 3px 10px 3px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
.about th { font-weight: 400; color: var(--text-muted); width: 150px; font-size: 12px; }
.about dl { display: grid; grid-template-columns: 180px 1fr; gap: 6px 14px; margin: 0; font-size: 13px; }
.about dt { font-weight: 600; }
.about dd { margin: 0; color: var(--text-secondary); }
.sources { color: var(--text-muted); font-size: 12px; margin-top: 24px; }

#tip { position: fixed; pointer-events: none; z-index: 30; display: none; max-width: 340px; padding: 4px 8px;
  background: var(--surface-1); border: 1px solid var(--border); font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
#tip .num { color: var(--hi); margin-right: 6px; }
#modal { position: fixed; inset: 24px; z-index: 40; background: var(--surface-1); border: 1px solid var(--border); display: grid; grid-template-rows: 36px 1fr; box-shadow: 0 8px 40px rgba(0,0,0,.45); }
#modal[hidden] { display: none; }
#modalBar { display: flex; align-items: center; gap: 10px; padding: 0 10px; border-bottom: 1px solid var(--border); }
#modalBody { position: relative; min-height: 0; }
#modalBody .fv { position: absolute; inset: 0; }
.fv .colmark { fill: var(--mark); stroke: none; }

@media (max-width: 1000px) {
  .figs { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) minmax(0, 40vh); }
  .fitem .fl { white-space: nowrap; }
  #bar { overflow-x: auto; }
  #tabs, #themeBtn { flex-shrink: 0; }
  #crumb { flex-shrink: 1; }
  .flist { display: flex; overflow-x: auto; overflow-y: hidden; border-right: 0; border-bottom: 1px solid var(--border); }
  .fitem { grid-template-columns: 40px auto; border-bottom: 0; border-right: 1px solid var(--border); }
  .fitem img { width: 40px; height: 40px; }
  .side { border-left: 0; border-top: 1px solid var(--border); grid-template-rows: auto; overflow-y: auto; }
  .info { overflow: visible; }
  .plist { overflow: visible; }
  .textv { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) 36vh; }
  .para { grid-template-columns: 40px minmax(0, 1fr); gap: 6px; }
  .tbody { padding: 8px 10px 48px; }
  .tcol { border-right: 0; border-bottom: 1px solid var(--border); }
  .tbar input { width: auto; flex: 1 1 0; min-width: 0; }
  .tbar select { flex: 1 1 0; min-width: 0; }
  .tbar { padding: 6px 10px; gap: 6px; }
  #bar { gap: 8px; padding: 0 8px; }
  #crumb .tt { display: none; }
  #tabs a { padding: 0 7px; }
  .cards { grid-template-columns: minmax(0, 1fr); }
  .card { grid-template-rows: 280px auto; }
  .gallery { padding: 0 16px 16px; }
  .gbar input { flex: 1 1 100%; }
  .frow > .lbl { width: 100%; }
}

</style>
</head>
<body>
<div id="app">
  <header id="bar">
    <a id="home" href="#/">Patents</a>
    <span id="crumb"></span>
    <nav id="tabs"></nav>
    <span class="spacer"></span>
    <button id="themeBtn" title="Toggle light / dark">Light</button>
  </header>
  <main id="main"></main>
</div>
<div id="tip"></div>
<div id="modal" hidden><div id="modalBar"><span id="modalTitle"></span><span class="spacer"></span><button id="modalClose">Close</button></div><div id="modalBody"></div></div>
<script>
// Shared renderer for traced patent figures. Used by the viewer and by pipeline/overlay.py.
// A trace is data/<pn>/traces/fig-<id>.json; all coordinates are pixels of the upright crop
// work/<pn>/figs/fig-<id>.png (origin top-left). Schema: see pipeline/TRACE_SCHEMA.md.
(function (root) {
  const NS = 'http://www.w3.org/2000/svg';
  const mk = (tag, a) => { const n = document.createElementNS(NS, tag); for (const k in a) if (a[k] != null) n.setAttribute(k, a[k]); return n; };
  const pts = d => d.map(p => p[0] + ',' + p[1]).join(' ');

  function defs(svg, uid) {
    const d = mk('defs', {});
    // arrowheads sized in stroke widths so they scale with the line they sit on
    [['end', 'auto'], ['start', 'auto-start-reverse']].forEach(([k, o]) => {
      const m = mk('marker', { id: `${uid}-ar-${k}`, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 5, markerHeight: 5, orient: o, markerUnits: 'strokeWidth' });
      m.appendChild(mk('path', { d: 'M0,0 L10,5 L0,10 z', class: 'tr-arrow' }));
      d.appendChild(m);
    });
    const p = mk('pattern', { id: `${uid}-hatch`, width: 14, height: 14, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' });
    p.appendChild(mk('line', { x1: 0, y1: 0, x2: 0, y2: 14, class: 'tr-hatchline' }));
    d.appendChild(p);
    const st = mk('pattern', { id: `${uid}-stipple`, width: 18, height: 18, patternUnits: 'userSpaceOnUse' });
    [[4, 4], [13, 9], [6, 14]].forEach(([x, y]) => st.appendChild(mk('circle', { cx: x, cy: y, r: 1.6, class: 'tr-arrow' })));
    d.appendChild(st);
    const ds = mk('pattern', { id: `${uid}-dashes`, width: 28, height: 20, patternUnits: 'userSpaceOnUse' });
    ds.appendChild(mk('line', { x1: 3, y1: 5, x2: 13, y2: 5, class: 'tr-hatchline' }));
    ds.appendChild(mk('line', { x1: 17, y1: 15, x2: 27, y2: 15, class: 'tr-hatchline' }));
    d.appendChild(ds);
    svg.appendChild(d);
    return d;
  }

  // hatch with custom pitch/angle (px, degrees), defined once per combination
  function hatchId(ctx, pitch, angle, hw) {
    const id = `${ctx.uid}-hatch-${pitch}-${angle}-${hw || 0}`.replace(/\./g, '_');
    if (!ctx.made.has(id)) {
      ctx.made.add(id);
      const p = mk('pattern', { id, width: pitch, height: pitch, patternUnits: 'userSpaceOnUse', patternTransform: `rotate(${angle})` });
      p.appendChild(mk('line', { x1: 0, y1: 0, x2: 0, y2: pitch, class: 'tr-hatchline', style: hw ? `stroke-width:${hw}` : null }));
      ctx.defs.appendChild(p);
    }
    return id;
  }

  function shape(s, ctx, dflt) {
    const uid = ctx.uid;
    const w = s.w != null ? s.w : dflt;
    const pat = ['hatch', 'stipple', 'dashes'].includes(s.fill);
    const fill = s.fill === 'solid' ? 'tr-fill-solid' : s.fill === 'light' ? 'tr-fill-light' : s.fill === 'paper' ? 'tr-fill-paper' : pat ? 'tr-fill-pat' : 'tr-fill-none';
    const a = { class: `tr-s ${fill}${s.dash ? ' tr-dash' : ''}${s.ink === 'paper' ? ' tr-ink-paper' : ''}`, 'stroke-width': w };
    const patId = s.fill === 'hatch' && (s.pitch || s.angle != null || s.hw) ? hatchId(ctx, s.pitch || 14, s.angle != null ? s.angle : 45, s.hw) : `${uid}-${s.fill}`;
    // inline style: stylesheet rules on .tr-s would override presentation attributes
    a.style = (pat ? `fill:url(#${patId});` : '') + (s.w === 0 ? 'stroke:none;' : '') || null;
    if (s.dash) a['stroke-dasharray'] = Array.isArray(s.dash) ? s.dash.join(' ') : `${w * 4} ${w * 3}`;

harge stored at the gate of the second transistor being used to render that transistor conductive when a binary one is stored, so that the word line signal is transmitted through this second transistor to the bit sense line. The entire memory in these and other embodiments disclosed is preferably fabricated in integrated circuit form using a single substrate of semiconductor material.","status":{"state":"Expired","term_end":"1985-06-04","basis":"17 years from grant","google_expiration":"1985-06-04","checked":"2026-10-28"},"inventors":[{"name":"Robert H. Dennard","city":"Croton-on-Hudson","region":"NY","country":"US","place":"Croton-on-Hudson, NY"}],"assignees":[{"name":"International Business Machines Corporation","city":"Armonk","region":"NY","country":"US","org":"IBM","kind":"company","place":"Armonk, NY"}],"counts":{"figures":9,"traced":9,"claims":21,"parts":37,"pages":9},"partnames":["another retangular section","bit line drivers and sense amplifiers","bit lines","capacitor","connection","deposited aluminum electrode","drain","drain terminal","field-effect transistor","gate","gate electrode","larger diffusion","memory cells","metallized conductor","metallized connection","output transistor","reference or biasing potential source","relatively thin layer of oxide","source","source terminal","storage node","substrate","terminals","thick layer of silicon dioxide","thin layer of oxide","third field-effect transistor","word line drivers","word lines"],"figures":[{"id":"1","label":"FIG. 1","front":true,"trace":{"fig":"1","w":1508,"h":1268,"stroke":3,"elements":[{"id":"blk20","ref":"20","kind":"block","shapes":[{"t":"l","d":[[1259.2,38.9],[405.2,47.4],[406.4,185.4]],"w":3},{"t":"l","d":[[1259.2,38.9],[1260.4,176.9],[406.4,185.4]],"w":5}]},{"id":"blk22","ref":"22","kind":"block","shapes":[{"t":"l","d":[[172.9,423.8],[41.1,425.1],[47.5,1140.4]],"w":3},{"t":"l","d":[[172.9,423.8],[179.3,1139.1],[47.5,1140.4]],"w":4.5}]},{"id":"body00","ref":"12","kind":"block","shapes":[{" <script>

  // ---------- theme ----------

        tr.innerHTML = cols.map(([k, , fn, c]) => `<td class="${c || ''}">${fn(p)}</td>`).join('');
        tb.appendChild(tr);
      });
      t.querySelector('thead').onclick = ev => {
        const th = ev.target.closest('th'); if (!th) return;
        if (st.s === th.dataset.k) st.d = -st.d; else { st.s = th.dataset.k; st.d = 1; }
        commit();
      };
      tb.onclick = ev => { const tr = ev.target.closest('tr'); if (tr) { const p = byPn[tr.dataset.pn]; location.href = link(p, frontFig(p)); } };
      tb.onmouseover = ev => {
        const tr = ev.target.closest('tr'); if (!tr) return;
        const p = byPn[tr.dataset.pn], fig = frontFig(p);
        const ppl = (p.inventors || []).map(i => `<div>${esc(i.name)}${i.place ? ` <span class="pl">${esc(i.place)}</span>` : ''}</div>`).join('');
        showTip(ev, `<img class="tthumb" src="${fig.img}" alt=""><div class="tmeta"><span class="num">US ${esc(p.number)}</span> ${esc(fig.label || '')}</div>${ppl}`);
      };
      tb.onmousemove = ev => { if (tip.style.display === 'block') moveTip(ev); };
      tb.onmouseleave = hideTip;
      wrap.appendChild(t); out.appendChild(wrap);
    }

    draw();
    view = { gallery: true, update(hash) { const s2 = galleryState(hash); Object.assign(st, s2); if (document.activeElement !== q) q.value = st.q; draw(); }, cleanup() { removeEventListener('keydown', onKey); } };
  }

  // ---------- figures tab ----------
  function FiguresTab(pat) {
    const root = h('div', 'figs'); main.appendChild(root);
    const list = h('div', 'flist'), center = h('div', 'center'), side = h('div', 'side');
    root.append(list, center, side);
    const tools = h('div', 'tools'); center.appendChild(tools);
    const stageBox = h('div', ''); stageBox.style.cssText = 'position:relative;min-height:0'; center.appendChild(stageBox);
    const info = h('div', 'info'), plist = h('div', 'plist'); side.append(info, plist);
    const st = { fig: null, pin: null, hover: null, tour: null, stepTimer: null };
    const fv = new FigureView(stageBox, {
      onHover: ref => { st.hover = ref; paint(); },
      onClick: ref => { stopTour(); pin(ref && ref === st.pin ? null : ref, false); },
      onMode: () => drawTools(),
    });
    fv.el.style.cssText = 'position:absolute;inset:0';
    pat.figures.forEach(f => {
      const it = h('div', 'fitem', `<img src="${f.thumb}" alt=""><div><div class="fl">${esc(f.label)}</div><div class="fs">Sheet ${esc(f.sheet || '')}${f.trace ? '' : ' &middot; scan only'}</div></div>`);
      it.dataset.fig = f.id; it.onclick = () => go(pat, 'figures', f.id); list.appendChild(it);
    });

    function pin(ref, fly = true) {
      st.pin = ref; go(pat, 'figures', st.fig.id, ref || undefined, true);
      paint(); if (ref && fly) fv.flyTo(ref);
    }
    function paint() {
      const ref = st.hover || st.pin;
      fv.highlight(ref);
      plist.querySelectorAll('.prow').forEach(r => r.classList.toggle('on', r.dataset.ref === ref));
      renderInfo(ref);
    }
    function renderInfo(ref) {
      const f = st.fig;
      if (!ref) {
        const note = pat.notes && pat.notes.figs && pat.notes.figs[f.id];
        const paras = f.paras.map(pid => pat.paras[pid]);
        info.innerHTML = `<h2>${esc(f.label)}</h2>
          ${f.brief.text ? `<p class="quote">${subsup(f.brief.text)} <span class="cite" data-col="${f.brief.col || ''}">${cite(f.brief.col, f.brief.line)}</span></p>` : ''}
          ${note ? `<div class="note"><span class="lbl">Note</span>${subsup(note)}</div>` : ''}
          ${paras.length ? `<div class="lbl sub">Referenced in ${paras.length} paragraph${paras.length > 1 ? 's' : ''}</div><div class="mlist">${paras.map(p =>
            `<div class="mitem" data-pid="${p.id}"><span class="cite">${cite(p.col, p.line)}</span> ${subsup(p.text.slice(0, 150))}${p.text.length > 150 ? '...' : ''}</div>`).join('')}</div>` : ''}`;
      } else {
        const p = pat.parts[ref] || { name: '', mentions: [], figs: [] };
        const note = pat.notes && pat.notes.parts && pat.notes.parts[ref];
        const figs = pat.figures.filter(x => (p.figs || []).includes(x.id) || (x.trace && x.trace.elements.some(e => e.ref === ref)));
        info.innerHTML = `<h2><span class="num">${esc(ref)}</span>${esc(p.name || UNNAMED)}</h2>
          ${p.alt && p.alt.length ? `<div class="alt">also: ${p.alt.map(esc).join('; ')}</div>` : ''}
          <div class="chips">${figs.map(x => `<span class="chip${x === f ? ' on' : ''}" data-fig="${x.id}">${esc(x.label)}</span>`).join('')}</div>
          ${note ? `<div class="note"><span class="lbl">Note</span>${subsup(note)}</div>` : ''}
          <div class="lbl sub">${p.mentions.length} mention${p.mentions.length === 1 ? '' : 's'} in the description</div>
          <div class="mlist">${p.mentions.map(m => `<div class="mitem" data-pid="${m[0]}"><span class="cite">${cite(pat.paras[m[0]].col, pat.paras[m[0]].line)}</span> ${mentionHtml(pat, m, ref)}</div>`).join('')}</div>`;
      }
      info.querySelectorAll('.mitem').forEach(n => n.onclick = () => go(pat, 'text', n.dataset.pid));
      info.querySelectorAll('.chip[data-fig]').forEach(n => n.onclick = () => go(pat, 'figures', n.dataset.fig, ref));
      info.querySelectorAll('.quote .cite').forEach(n => n.onclick = () => openScan(pat, +n.dataset.col, n.textContent));
    }
    function buildParts() {
      const f = st.fig;
      plist.innerHTML = `<div class="head"><span class="lbl">Parts</span><span class="lbl num">${f.refs.length}</span></div>`;
      f.refs.forEach(ref => {
        const r = h('div', 'prow', `<span class="num">${esc(ref)}</span><span>${esc(partName(pat, ref) || UNNAMED)}</span>`);
        r.dataset.ref = ref;
        r.onmouseenter = () => { st.hover = ref; paint(); };
        r.onmouseleave = () => { st.hover = null; paint(); };
        r.onclick = () => { stopTour(); pin(ref === st.pin ? null : ref); };
        if (!fv.has(ref)) r.style.color = 'var(--text-muted)';
        plist.appendChild(r);
      });
    }
    // tour through parts in order of first mention; step through timing figures
    function tourRefs() { return st.fig.refs.filter(r => fv.has(r)); }
    function tourStep(d) {
      const rs = tourRefs(); if (!rs.length) return;
      let i = rs.indexOf(st.pin); i = i < 0 ? (d > 0 ? 0 : rs.length - 1) : (i + d + rs.length) % rs.length;
      pin(rs[i]);
      const row = plist.querySelector(`.prow[data-ref="${CSS.escape(rs[i])}"]`); if (row) row.scrollIntoView({ block: 'nearest' });
    }
    function stopTour() { if (st.tour) { clearInterval(st.tour); st.tour = null; drawTools(); } }
    function stopStep() { if (st.stepTimer) { clearInterval(st.stepTimer); st.stepTimer = null; } }
    function drawTools() {
      const f = st.fig, has = !!f.trace;
      tools.innerHTML = '';
      const modes = h('span', 'grp');
      [['trace', 'Redraw'], ['scan', 'Scan'], ['overlay', 'Overlay']].forEach(([m, n]) => {
        const b = h('button', fv.mode === m ? 'on' : '', n); b.disabled = !has && m !== 'scan';
        b.onclick = () => { fv.setMode(m); drawTools(); }; modes.appendChild(b);
      });
      tools.append(h('span', 'lbl', 'View'), modes);
      const tg = h('span', 'grp');
      const bp = h('button', '', '&lt;'), bplay = h('button', st.tour ? 'on' : '', st.tour ? 'Pause' : 'Play'), bn = h('button', '', '&gt;');
      bp.title = 'Previous part (Left)'; bn.title = 'Next part (Right)'; bplay.title = 'Step through parts in order of first mention';
      bp.onclick = () => { stopTour(); tourStep(-1); }; bn.onclick = () => { stopTour(); tourStep(1); };
      bplay.onclick = () => { if (st.tour) return stopTour(); tourStep(1); st.tour = setInterval(() => tourStep(1), 2200); drawTools(); };
      [bp, bplay, bn].forEach(b => { b.disabled = !has; tg.appendChild(b); });
      tools.append(h('span', 'lbl', 'Parts tour'), tg);
      if (fv.maxStep >= 0) {
        const steps = (f.trace.steps && f.trace.steps.names) || [];
        const lbl = (f.trace.steps && f.trace.steps.label) || 'Step';
        const sl = h('input'); sl.type = 'range'; sl.min = -1; sl.max = fv.maxStep; sl.step = 1; sl.value = fv.step == null ? fv.maxStep : fv.step;
        const v = h('span', 'stepv num');
        const upd = () => { const n = +sl.value; fv.setStep(n === fv.maxStep && !st.stepTimer && sl.dataset.touched !== '1' ? null : n); v.innerHTML = n < 0 ? 'start' : subsup(steps[n] || `${n}`); };
        sl.oninput = () => { sl.dataset.touched = '1'; stopStep(); upd(); };
        const sp = h('button', '', 'Play'); sp.onclick = () => {
          if (st.stepTimer) { stopStep(); sp.textContent = 'Play'; return; }
          sl.dataset.touched = '1'; if (+sl.value >= fv.maxStep) sl.value = -1; upd(); sp.textContent = 'Pause';
          st.stepTimer = setInterval(() => { if (+sl.value >= fv.maxStep) { stopStep(); sp.textContent = 'Play'; return; } sl.value = +sl.value + 1; upd(); }, 650);
        };
        tools.append(h('span', 'lbl', esc(lbl)), sp, sl, v);
        const qs = /[?&]step=(\d+)/.exec(location.search); // headless review hook
        if (qs) { sl.value = qs[1]; sl.dataset.touched = '1'; }
        upd();
      }
      const fit = h('button', '', 'Fit'); fit.title = 'Fit (F)'; fit.onclick = () => fv.pz.fit();
      tools.append(h('span', 'spacer'), fit);
    }
    const key = ev => {
      if (ev.target.closest('input,select,textarea') || !$('#modal').hidden) return;
      if (ev.key === 'ArrowRight') { stopTour(); tourStep(1); ev.preventDefault(); }
      else if (ev.key === 'ArrowLeft') { stopTour(); tourStep(-1); ev.preventDefault(); }
      else if (ev.key === 'f' || ev.key === 'F') fv.pz.fit();
      else if (ev.key === 'Escape') { stopTour(); pin(null, false); fv.pz.fit(); }
      else if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
        const i = pat.figures.indexOf(st.fig) + (ev.key === 'ArrowDown' ? 1 : -1);
        if (pat.figures[i]) { go(pat, 'figures', pat.figures[i].id); ev.preventDefault(); }
      }
    };
    addEventListener('keydown', key);
    const obs = new MutationObserver(() => { if (!root.isConnected) { removeEventListener('keydown', key); stopTour(); stopStep(); obs.disconnect(); } });
    obs.observe(main, { childList: true });
    return {
      update(r) {
        const f = pat.figById[r.a] || pat.figures[0];
        if (f !== st.fig) {
          stopTour(); stopStep(); st.fig = f; st.pin = null; st.hover = null;
          fv.show(pat, f); drawTools(); buildParts();
          list.querySelectorAll('.fitem').forEach(n => n.classList.toggle('on', n.dataset.fig === f.id));
          const li = list.querySelector('.fitem.on'); if (li) li.scrollIntoView({ block: 'nearest', inline: 'nearest' });
          if (!r.a) go(pat, 'figures', f.id, undefined, true);
        }
        if ((r.b || null) !== st.pin) { st.pin = r.b || null; paint(); if (st.pin) requestAnimationFrame(() => fv.flyTo(st.pin)); }
        else paint();
      }
    };
  }

  // ---------- description / claims with a linked figure pane ----------
  function linkedPane(pat, host) {
    const pane = h('div', 'pane'); host.appendChild(pane);
    const tools = h('div', 'tools'); pane.appendChild(tools);
    const box = h('div', ''); box.style.cssText = 'position:relative;min-height:0'; pane.appendChild(box);
    const st = { fig: null, ref: null, lock: null };
    const fv = new FigureView(box, { onClick: ref => { if (ref) go(pat, 'figures', st.fig.id, ref); }, tag: f => f.label });
    fv.el.style.cssText = 'position:absolute;inset:0';
    const sel = h('select'); pat.figures.forEach(f => sel.appendChild(new Option(f.label, f.id)));
    sel.onchange = () => { st.lock = sel.value; show(pat.figById[sel.value]); };
    const open = h('button', '', 'Open in Figures'); open.onclick = () => go(pat, 'figures', st.fig.id, st.ref || undefined);
    const modes = h('span', 'grp');
    const drawModes = () => { modes.innerHTML = ''; [['trace', 'Redraw'], ['scan', 'Scan']].forEach(([m, n]) => { const b = h('button', fv.mode === m ? 'on' : '', n); b.disabled = !st.fig.trace && m !== 'scan'; b.onclick = () => { fv.setMode(m); drawModes(); }; modes.appendChild(b); }); };
    tools.append(sel, modes, h('span', 'spacer'), open);
    function show(f) { if (!f) return; if (f !== st.fig) { st.fig = f; fv.show(pat, f); sel.value = f.id; drawModes(); } }
    function figFor(ref) {
      if (st.fig && fv.has(ref)) return st.fig;
      const p = pat.parts[ref];
      const ids = (p && p.figs) || [];
      return pat.figures.find(f => ids.includes(f.id) && f.trace) || pat.figures.find(f => ids.includes(f.id)) || null;
    }
    show(pat.figures[0]);
    return {
      hoverRef(ref) {
        if (ref) { const f = figFor(ref); if (f) show(f); }
        st.ref = ref; fv.highlight(ref); if (ref && fv.has(ref)) fv.flyTo(ref); else if (!ref) fv.pz.fit();
      },
      showFig(id) { st.lock = null; show(pat.figById[id]); },
      follow(id) { if (!st.lock && !st.ref) show(pat.figById[id]); },
    };
  }

  function bindRich(container, pat, pane) {
    container.addEventListener('mouseover', ev => {
      const a = ev.target.closest('a.rf, a.fg'); if (!a) return;
      if (a.classList.contains('rf')) { showTip(ev, partTip(pat, a.dataset.ref)); pane.hoverRef(a.dataset.ref); container.querySelectorAll(`a.rf[data-ref="${CSS.escape(a.dataset.ref)}"]`).forEach(x => x.classList.add('on')); }
      else pane.showFig(a.dataset.fig);
    });
    container.addEventListener('mousemove', ev => { if (tip.style.display === 'block') moveTip(ev); });
    container.addEventListener('mouseout', ev => {
      const a = ev.target.closest('a.rf'); if (!a) return;
      hideTip(); container.querySelectorAll('a.rf.on').forEach(x => x.classList.remove('on')); pane.hoverRef(null);
    });
    container.addEventListener('click', ev => {
      const a = ev.target.closest('a.rf, a.fg, .cite'); if (!a) return;
      if (a.classList.contains('rf')) { const f = pat.figures.find(f => (pat.parts[a.dataset.ref] || {}).figs && pat.parts[a.dataset.ref].figs.includes(f.id)); if (f) go(pat, 'figures', f.id, a.dataset.ref); }
      else if (a.classList.contains('fg')) go(pat, 'figures', a.dataset.fig);
      else if (a.dataset.col || a.dataset.page) openScan(pat, +a.dataset.col, a.textContent, a.dataset.page);
    });
  }

  function TextTab(pat) {
    const root = h('div', 'textv'); main.appendChild(root);
    const col = h('div', 'tcol'); root.appendChild(col);
    const pane = linkedPane(pat, root);
    const bar = h('div', 'tbar'); col.appendChild(bar);
    const q = h('input'); q.type = 'search'; q.placeholder = 'Search description';
    const secSel = h('select'); pat.sections.forEach((s, i) => secSel.appendChild(new Option(s.heading || 'Opening (no heading)', i)));
    const count = h('span', 'lbl num');
    bar.append(q, secSel, count);
    const body = h('div', 'tbody'); col.appendChild(body);
    const abs = h('div', ''); body.appendChild(abs);
    abs.innerHTML = `<div class="tsec">Abstract</div><div class="para"><span class="cite" data-col="">front</span><p>${subsup(pat.abstract || '')}</p></div>`;
    const nodes = [];
    pat.sections.forEach((s, si) => {
      const hd = h('div', 'tsec', esc(s.heading)); hd.dataset.sec = si; if (!s.heading) hd.style.margin = '12px 0 0'; body.appendChild(hd);
      pat.paras.filter(p => p.sec === si).forEach(p => {
        const n = h('div', 'para'); n.dataset.pid = p.id;
        const c = `<span class="cite" data-col="${p.col || ''}" data-page="${p.page != null ? p.page : ''}" title="Show on the scanned page">${p.page != null && !p.col ? `p.${p.page + 1}` : cite(p.col, p.line)}</span>`;
        n.innerHTML = c + (p.table ? `<div><table>${p.table.map(r => `<tr>${r.map(x => `<td>${subsup(x)}</td>`).join('')}</tr>`).join('')}</table></div>` : `<p>${rich(p.text, p.spans)}</p>`);
        body.appendChild(n); nodes.push([p, n]);
      });
    });
    bindRich(body, pat, pane);
    secSel.onchange = () => { const hd = body.querySelector(`.tsec[data-sec="${secSel.value}"]`); if (hd) hd.scrollIntoView({ block: 'start' }); };
    let qt = 0;
    q.oninput = () => {
      clearTimeout(qt); qt = setTimeout(() => {
        const s = q.value.trim(); let hit = 0;
        const re = s ? new RegExp(s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi') : null;
        nodes.forEach(([p, n]) => {
          if (p.table) { n.style.display = re ? 'none' : ''; return; }
          const ok = !re || re.test(p.text); if (re) re.lastIndex = 0;
          n.style.display = ok ? '' : 'none'; if (ok && re) hit++;
          const pp = n.querySelector('p'); if (pp) pp.innerHTML = rich(p.text, p.spans, ok ? re : null);
        });
        body.querySelectorAll('.tsec').forEach(x => x.style.display = re ? 'none' : '');
        abs.style.display = re ? 'none' : '';
        count.textContent = re ? `${hit} paragraphs` : '';
      }, 120);
    };
    // the pane follows the figure referenced by the topmost paragraph in view
    const io = new IntersectionObserver(es => {
      const vis = es.filter(e => e.isIntersecting).map(e => e.target).sort((a, b) => a.getBoundingClientRect().top - b.getBoundingClientRect().top);
      for (const n of vis) { const p = pat.paras[+n.dataset.pid]; const fs = p && p.spans.find(s => s[2] === 'fig'); if (fs) { pane.follow(fs[3]); break; } }
    }, { root: col, rootMargin: '0px 0px -60% 0px' });
    nodes.forEach(([, n]) => io.observe(n));
    return {
      update(r) {
        if (r.a != null && r.a !== '') {
          const n = body.querySelector(`.para[data-pid="${CSS.escape(r.a)}"]`);
          if (n) { n.scrollIntoView({ block: 'center' }); n.classList.add('flash'); setTimeout(() => n.classList.remove('flash'), 1600); }
        }
      }
    };
  }

  function ClaimsTab(pat) {
    const root = h('div', 'textv'); main.appendChild(root);
    const col = h('div', 'tcol'); root.appendChild(col);
    const pane = linkedPane(pat, root);
    const bar = h('div', 'tbar'); col.appendChild(bar);
    const q = h('input'); q.type = 'search'; q.placeholder = 'Search claims';
    const ind = h('button', 'on', 'Independent + dependent'); const only = h('button', '', 'Independent only');
    const grp = h('span', 'grp'); grp.append(ind, only);
    const count = h('span', 'lbl num'); bar.append(q, grp, count);
    const body = h('div', 'tbody'); col.appendChild(body);
    const nodes = pat.claims.map(c => {
      const n = h('div', 'claim' + (c.depends ? ' dep' : ''));
      n.innerHTML = `<div class="lbl"><span class="num">${c.n}</span>${c.depends ? ` &middot; depends on ${c.depends}` : ' &middot; independent'} <span class="cite" data-col="${c.col || ''}" data-page="${c.page != null ? c.page : ''}">${cite(c.col, c.line)}</span></div><p>${rich(c.text, c.spans)}</p>`;
      body.appendChild(n); return [c, n];

    bindRich(body, pat, pane);

      nodes.forEach(([c, n]) => {

      });
      count.textContent = `${k} of ${nodes.length}`;
    };
    q.oninput = apply;
    ind.onclick = () => { indOnly = false; ind.className = 'on'; only.className = ''; apply(); };
    only.onclick = () => { indOnly = true; only.className = 'on'; ind.className = ''; apply(); };
    apply();
    return { update() { } };
  }

        ${row('Assignee', ent.assignees ? (ent.assignees.map(personHtml).join('<br>') || '<span class="unk">none printed</span>') : esc(pat.assignee))}
        ${row('Application no.', `<span class="num">${esc(pat.appl_no)}</span>`)}
        ${row('Filed', `<span class="num">${esc(pat.filed)}</span>`)}

        ${row('Int. Cl.', esc(pat.int_cl))}

      <h3>Parts index</h3>
      <table>${Object.values(pat.parts).sort((a, b) => parseInt(a.ref) - parseInt(b.ref) || a.ref.localeCompare(b.ref)).map(p =>
        `<tr><th class="num"><a href="#/${pat.pn}/figures/${esc((p.figs || [])[0] || pat.figures[0].id)}/${esc(p.ref)}">${esc(p.ref)}</a></th><td>${esc(p.name)}${p.alt && p.alt.length ? ` <span class="lbl">also</span> ${p.alt.map(esc).join('; ')}` : ''}</td><td class="num">${(p.figs || []).join(', ')}</td></tr>`).join('')}</table>
      ${pat.refs_patents && pat.refs_patents.length ? `<h3>U.S. patent documents cited</h3><table>${pat.refs_patents.map(r =>
        `<tr><td class="num">${esc(r.no)}</td><td class="num">${esc(r.date)}</td><td>${esc(r.name)}</td><td class="num">${esc(r.cl)}</td></tr>`).join('')}</table>` : ''}
      ${pat.refs_other && pat.refs_other.length ? `<h3>Other publications</h3><table>${pat.refs_other.map(r => `<tr><td>${esc(r)}</td></tr>`).join('')}</table>` : ''}
      <div class="sources">Text: OCR of the USPTO scan, checked against the scan and ${pat.google ? `<a href="${esc(pat.google)}" target="_blank" rel="noopener">Google Patents</a>` : 'Google Patents'}; ${pat.ocr_fixes} OCR corrections; spelling kept as printed. Citations column:line. Redraws traced from the drawing sheets; Scan view shows the original. Notes are added context, not patent text.</div>
    </div>`;
    return { update() { } };
  }

  if (SITE.home) $('#home').href = SITE.home;
  route();

  // ?selftest: drive every route, figure, part and hover; report into the #selftest block (read with --dump-dom)
  if (/selftest/.test(location.search)) {
    const errs = [], log = [];
    addEventListener('error', e => errs.push(`${e.message} @${e.lineno}`));
    addEventListener('unhandledrejection', e => errs.push(`rejection: ${e.reason && e.reason.stack || e.reason}`));
    const wait = ms => new Promise(r => setTimeout(r, ms));
    (async () => {
      if (SITE.links) {  // gallery page: cards only
        route('#/'); await wait(100);
        const cards = document.querySelectorAll('.card'), bad = [...cards].filter(c => !/^p\/\d+\.html#\//.test(c.getAttribute('href')));
        if (bad.length || cards.length !== PATS.length) errs.push(`gallery: ${cards.length} cards for ${PATS.length} patents, ${bad.length} bad links`);
        log.push(`gallery: ${cards.length} cards, ${document.querySelectorAll('.card svg .tr-el, .card svg [data-ref]').length} trace elements`);
        const n = () => document.querySelectorAll('.card, .gtable tbody tr').length;
        for (const v of ['cards', 'table']) for (const k of Object.keys(SORTS)) for (const d of ['', '&d=desc']) {
          route(`#/?v=${v}&s=${k}${d}`); await wait(5);
          if (n() !== PATS.length) errs.push(`${v} sort ${k}${d}: ${n()} rows`);
        }
        const probe = PATS[0], term = ((probe.inventors || [])[0] || {}).name || probe.title;
        route(`#/?v=table&q=${encodeURIComponent(term)}`); await wait(5);
        if (!document.querySelector(`.gtable tr[data-pn="${probe.pn}"]`)) errs.push(`search "${term}" misses ${probe.pn}`);
        route(`#/?q=zzzz-no-match`); await wait(5);
        if (!document.querySelector('.gnone')) errs.push('no-match state missing');
        for (const [k] of FACETS) for (const v of new Set(PATS.flatMap(p => p.facet[k]))) {
          route(`#/?v=table&${k}=${encodeURIComponent(v)}`); await wait(5);
          const want = PATS.filter(p => p.facet[k].includes(v)).length;
          if (n() !== want) errs.push(`facet ${k}=${v}: ${n()} rows, want ${want}`);
        }
        log.push(`gallery: ${Object.keys(SORTS).length} sorts x 2 views x 2 dirs, search, facets checked`);
      } else for (const p of PATS) {
        for (const f of p.figures) {
          route(`#/${p.pn}/figures/${f.id}`); await wait(30);
          const refs = f.refs.slice(0, 40);
          for (const r of refs) { route(`#/${p.pn}/figures/${f.id}/${r}`); await wait(5); }
          const hits = document.querySelectorAll('.fv .hit [data-ref]').length, on = document.querySelectorAll('.fv .tr-el.on').length;
          log.push(`${p.pn} fig ${f.id}: trace=${!!f.trace} hit=${hits} lastSelOn=${on} refs=${f.refs.length} missingInTrace=${f.trace ? f.refs.filter(r => !f.trace.elements.some(e => e.ref === r)).join(',') : '-'}`);
        }
        for (const t of ['text', 'claims', 'about']) {
          route(`#/${p.pn}/${t}`); await wait(120);
          const a = document.querySelector('a.rf');
          if (a) { a.dispatchEvent(new MouseEvent('mouseover', { bubbles: true, clientX: 10, clientY: 10 })); await wait(20); a.dispatchEvent(new MouseEvent('mouseout', { bubbles: true })); }
          log.push(`${p.pn} ${t}: view=${view && view.pat.pn}/${view && view.tab} rf=${document.querySelectorAll('a.rf').length} fg=${document.querySelectorAll('a.fg').length}`);
        }
      }
      const pre = document.createElement('pre'); pre.id = 'selftest';
      pre.textContent = `SELFTEST ${errs.length ? 'FAIL' : 'PASS'}\n` + errs.join('\n') + '\n' + log.join('\n');
      document.body.appendChild(pre);
    })();
  }
})();

</script>
</body>
</html>
