<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiNbO3 Poling</title>
<style>
:root {
  --bg: #0b0d10; --panel: #14171b; --line: #2a2f35; --text: #c7d0d9; --dim: #7d8791;
  --cur: #5794f2; --volt: #ff9830; --up: #e0a24a; --dn: #3b78e0; --li: #cc80ff; --nb: #73c2c9; --o: #ff2a2a;
}
* { box-sizing: border-box; border-radius: 0 !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 12px/1.3 -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
#app { display: grid; grid-template-rows: 34px 1fr; height: 100%; }
#bar { display: flex; align-items: center; gap: 10px; padding: 0 10px; background: var(--panel);
  border-bottom: 1px solid var(--line); }
#bar .title { font-weight: 600; letter-spacing: .02em; white-space: nowrap; }
button, select { background: #1c2026; color: var(--text); border: 1px solid var(--line); height: 24px;
  padding: 0 6px; font: inherit; cursor: pointer; }
button { width: 28px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
button:hover, select:hover { border-color: #4a525b; }
button svg { width: 14px; height: 14px; fill: currentColor; }
button.on { border-color: #ff9830; color: #ff9830; }
.hd button { height: 18px; width: 24px; }
.hd button svg { width: 12px; height: 12px; }
#scrub { flex: 1; min-width: 80px; accent-color: #ff9830; height: 14px; }
#readout { font-family: ui-monospace, Menlo, monospace; color: var(--dim); white-space: nowrap; font-size: 11px; }
#readout b { color: var(--text); font-weight: 500; }
.leg { display: inline-flex; align-items: center; gap: 4px; color: var(--dim); white-space: nowrap; }
.leg i { width: 9px; height: 9px; display: inline-block; }
#grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 1px;
  background: var(--line); min-height: 0; }
.panel { background: var(--panel); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.hd { height: 24px; display: flex; align-items: center; gap: 10px; padding: 0 8px; color: var(--dim);
  border-bottom: 1px solid var(--line); flex: none; }
.hd .lbl { color: var(--text); cursor: help; }
.hd .sp { flex: 1; }
.body { position: relative; flex: 1; min-height: 0; background: #0e1013; }
.body canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#well { position: absolute; left: 8px; bottom: 8px; width: 150px; height: 96px; background: rgba(11,13,16,.8);
  border: 1px solid var(--line); inset: auto auto 8px 8px; width: 150px; height: 96px; }
#ucInfo { position: absolute; right: 8px; top: 6px; text-align: right; font-family: ui-monospace, Menlo, monospace;
  font-size: 11px; color: var(--dim); pointer-events: none; }
#ucInfo b { color: var(--text); font-weight: 500; }
#tip { position: fixed; z-index: 10; max-width: 340px; background: #1c2026; border: 1px solid #4a525b;
  padding: 6px 8px; color: var(--text); font-size: 11px; pointer-events: none; display: none; white-space: pre-line; }
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <span class="title">LiNbO3 periodic poling</span>
    <button id="play" data-tip="Play / pause (space)"><svg viewBox="0 0 16 16" id="playIcon"><path d="M3 2l11 6-11 6z"/></svg></button>
    <button id="restart" data-tip="Restart"><svg viewBox="0 0 16 16"><path d="M3 2h2v12H3zM14 2v12L6 8z"/></svg></button>
    <button id="orbit" class="on" data-tip="Camera orbit in (c) and (d): run / pause"><svg viewBox="0 0 16 16"><path d="M8 2a6 6 0 1 0 6 6h-2a4 4 0 1 1-4-4v2.5l4-3.5-4-3.5z"/></svg></button>
    <select id="speed" data-tip="Playback speed multiplier">
      <option value="0.25">0.25x</option><option value="0.5">0.5x</option><option value="1" selected>1x</option>
      <option value="2">2x</option><option value="4">4x</option>
    </select>
    <input id="scrub" type="range" min="0" max="10" step="0.001" value="0" data-tip="Pulse time (ms)">
    <span id="readout"></span>
    <span class="leg" data-tip="Spontaneous polarization direction of the local lattice"><i style="background:var(--up)"></i>+Z<i style="background:var(--dn)"></i>-Z</span>
  </div>
  <div id="grid">
    <div class="panel">
      <div class="hd"><span class="lbl" data-tip="Applied voltage and measured current vs time. Q = 90 pC switching charge.&#10;Voltage: trapezoid from the supplied figure panel (c): 0 V to 560 V between 1.5 and 2.7 ms, hold to 3.5 ms, linear fall to 0 V at 8.5 ms.&#10;Current = C dV/dt (C = 0.1 pF) + switching pulse with peak ~280 nA at 2.43 ms and area 90 pC. Synthesized to the figure's features, not digitized data.&#10;Drag on the plot to scrub.">(a) Voltage and current</span><span class="sp"></span></div>
      <div class="body"><canvas id="cGraph"></canvas></div>
    </div>
    <div class="panel">
      <div class="hd"><span class="lbl" data-tip="SHG-microscope-style top view of an x-cut film (surface normal = crystal x, out of the page); grayscale = SH intensity (1 = white). Domain walls are dark lines, poled domains slightly darker; black blocks are the electrodes (+V top, ground bottom) that block SH light.&#10;Crystal z lies in the plane, vertical, along the field between the electrodes; period along y. Initial Ps = +z (up, opposing E); poled domains have Ps = -z. Arrow row above the image shows the local Ps (amber up, blue down).&#10;Stripes are attached to the electrode edge, grow along z with a rounded front, then broaden along y. Front shape and the intensity contrast are schematic, not simulated SHG.&#10;Switched area fraction = integral of switching current / Q, so the domain area tracks the current graph exactly.&#10;Dashed box: region shown in (c). Dot: unit cell shown in (d).">(b) Domain, top view</span><span class="sp"></span></div>
      <div class="body"><canvas id="cTop"></canvas></div>
    </div>
    <div class="panel">
      <div class="hd"><span class="lbl" data-tip="Thin x-cut LiNbO3 film (R3c, hexagonal cell a = 5.148 A, c = 13.863 A) around one stripe domain: crystal z (the polar axis) runs along the long direction between the electrodes, i.e. along/opposite to E; surface normal = crystal x, 3 cells thick; 16 cells per period along y. Schematic scale: a real period is ~10^4 cells.&#10;Atoms: Li, Nb, O; each atom is displaced along the flip path when the domain wall reaches it. Atom displacements are drawn x2 for visibility.&#10;Arrows: Ps of each unit cell along z (amber +z toward the +V end, blue -z). Domain front slowed in playback.&#10;Deeper layers switch slightly later (schematic).&#10;Drag to rotate; slow auto-orbit.">(c) Lattice, domain front</span>
        <span class="sp"></span>
        <button id="arrowsBtn" class="on" data-tip="Show / hide the built-in polarization (Ps) arrow of every unit cell"><svg viewBox="0 0 16 16"><path d="M8 1l5 6H9.2v8H6.8V7H3z"/></svg></button>
        <span class="leg"><i style="background:var(--li)"></i>Li<i style="background:var(--nb)"></i>Nb<i style="background:var(--o)"></i>O</span></div>
      <div class="body" id="ovBody"></div>
    </div>
    <div class="panel">
      <div class="hd"><span class="lbl" data-tip="One hexagonal unit cell (30 atoms: 6 Li, 6 Nb, 18 O; periodic images on faces shown) in the O-fixed frame. True displacements, no exaggeration.&#10;Structure: Hsu et al., Acta Cryst. B53, 420 (1997), synchrotron X-ray, 293 K (COD 2101845).&#10;Flip path: Li moves 1.43 A through its O3 triangle (violet plane); Nb moves 0.55 A through the centre of its O6 octahedron (teal); O twists 0.09 A in-plane. Paraelectric reference: Li in the O plane, Nb at the octahedron centre.&#10;Cyan streaks and arrows: applied field (ramps with V). Amber/blue streaks: internal polarization field of the cell. Arrows on atoms: force q E (cations pulled along E, anions opposite). Glows: orange cation, blue anion.&#10;Inset: schematic double-well in the polar coordinate, tilted by V; the hop is nucleation-assisted, not intrinsic (intrinsic well depth 18.3 mRy per 10-atom cell, Inbar and Cohen 1996).">(d) Unit cell, atomic flip</span>
        <span class="sp"></span>
        <span class="leg"><i style="background:#ff8a3d"></i>cation field<i style="background:#3da5ff"></i>anion field<i style="background:#7fe0ff"></i>applied E</span></div>
      <div class="body" id="ucBody"><canvas id="well"></canvas><div id="ucInfo"></div></div>
    </div>
  </div>
</div>
<div id="tip"></div>
<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="data/lattice_data.js"></script>
<script src="js/waveform.js"></script>
<script src="js/domain.js"></script>
<script src="js/lattice.js"></script>
<script src="js/graph.js"></script>
<script src="js/topview.js"></script>
<script src="js/overview.js"></script>
<script src="js/unitcell.js"></script>
<script src="js/app.js"></script>
</body>
</html>
