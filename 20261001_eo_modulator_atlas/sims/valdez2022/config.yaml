# STATUS: record of disclosed geometry and provenance. NOT RUNNABLE as written: the paper states no refractive index or RF
# permittivity for LN, SiO2 or Si and no gold conductivity; they are omitted on purpose (see `missing`).
# Coordinate frame: x lateral, y film normal up, z propagation. x = 0 at the signal electrode centre; y = 0 at BOX top / Si strip bottom.
# Top-level `geometry` = slotted section (electrode edges recessed by the 4 um slot depth); `alt_geometries.protrusion` = section through the
# 20 um electrode protrusions (gap 9 um). Numbers come from the cached arXiv v1 manuscript.

