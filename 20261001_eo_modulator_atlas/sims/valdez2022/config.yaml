limitations: [scalar_optical_not_full_vector, quasi_static_2d_rf, rectangular_or_polygon_sidewalls_only, no_3d_launch_pad_effects, Config is not runnable until material constants are supplied from a verified source; the engine rejects dielectrics without
    eps_r by design, Slot loading is represented as a two-section periodic cascade (protrusion/slotted) using the periodic_t_rail form; this is an inductive-loading structure with no T-rail bars, Z0 target of 42 ohm has unspecified provenance in the paper;
