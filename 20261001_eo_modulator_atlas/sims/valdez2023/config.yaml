# STATUS: record of disclosed geometry and provenance for the CN1 device. NOT RUNNABLE as written (material constants and BOX
# thickness missing, see `missing`). Coordinate frame: x lateral, y film normal up, z propagation; x = 0 at the signal electrode
# centre; y = 0 at the top of the BOX / Si strip bottom. Top-level `geometry` = slot section (electrode edges recessed 4 um);
# `alt_geometries.protrusion` = section through the 20 um protrusions (gap G = 8 um). BOX thickness 3 um is borrowed from valdez2022 (not stated here).
# Numbers come from the cached arXiv v2 manuscript.

