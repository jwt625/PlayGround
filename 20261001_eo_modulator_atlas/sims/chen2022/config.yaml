schema: eo-atlas.sim/v1
id: chen2022-c
paper_id: chen2022
device_id: chen2022-c
title: Chen 2022, 10 mm periodic T-rail CLTW TFLN MZM on undercut silicon (G-S-G, push-pull arms)
repro_grade: B
validation_status: unvalidated
chain: [electrostatics, optical_mode, eo_overlap, rf_line, loaded_line, eo_response]

# Coordinate frame: x lateral (paper Z), y film normal up (paper X), z propagation (paper Y).
# Origin: optical axis of the RIGHT-hand waveguide in x; y = 0 at the BOX top / LN bottom.
# Signal electrode centre at x = -55.4 um (mirror plane of the structure); LEFT waveguide at x = -110.8 um.
# The optical mode is solved on the right waveguide (optical_window); both arms are modelled in the electrostatics
# (full domain, symmetry none) so that the push-pull field in the two gaps is produced by the geometry.
optics:
  wavelength_nm: 1550              # NOT reported by the paper; see provenance and missing
  polarization: TE
  mode_index: 0
  group_index_from: finite_difference_wavelength
  ng_fixed: null
  eo_axis: auto

materials:
  lithium_niobate:
    crystal: {cut: x, propagation: y}
    n_o: 2.211
    n_e: 2.138
    eps_r: {perp: 43.0, par: 28.0}
    r_pm_per_v: {r13: 8.6, r22: 3.4, r33: 30.8, r51: 28.0}
  silicon_dioxide: {n: 1.444, eps_r: 3.9}
  silicon: {n: 3.476, eps_r: 11.7}
  gold: {conductor: true, sigma_Sm: 4.1e7, n_complex: null}
  air: {n: 1.0, eps_r: 1.0}

geometry:                          # LOADED cross-section: slots + undercut + T-bar pads (the cross-section drawn in Fig. 2(a),(b))
  symmetry: none
  domain: {x_um: [-300, 190], y_um: [-250, 120]}
  regions:
    - {name: ambient, material: air, rect: {x_um: [-300, 190], y_um: [-250, 120]}}
    - {name: substrate, material: silicon, rect: {x_um: [-300, 190], y_um: [-728, -3]}}
    - {name: box, material: silicon_dioxide, rect: {x_um: [-300, 190], y_um: [-3, 0]}}
    - {name: ln_slab, material: lithium_niobate, rect: {x_um: [-300, 190], y_um: [0, 0.2]}}
    - {name: sio2_cladding, material: silicon_dioxide, rect: {x_um: [-300, 190], y_um: [0.2, 1.1]}}
    - {name: ln_rib_r, material: lithium_niobate, polygon_um: [[-0.84,0.2],[0.84,0.2],[0.75,0.4],[-0.75,0.4]]}
    - {name: ln_rib_l, material: lithium_niobate, polygon_um: [[-111.64,0.2],[-109.96,0.2],[-110.05,0.4],[-111.55,0.4]]}
    - {name: slot_r_inner, material: air, rect: {x_um: [-14.9, -5.9], y_um: [-3, 1.1]}}
    - {name: slot_r_outer, material: air, rect: {x_um: [5.9, 14.9], y_um: [-3, 1.1]}}
    - {name: slot_l_inner, material: air, rect: {x_um: [-104.9, -95.9], y_um: [-3, 1.1]}}
    - {name: slot_l_outer, material: air, rect: {x_um: [-125.7, -116.7], y_um: [-3, 1.1]}}
    - {name: undercut_r_inner, material: air, polygon_um: [[-45.4, -3.0], [-44.87, -9.08], [-43.29, -14.97], [-40.71, -20.5], [-37.21, -25.5], [-32.9, -29.81], [-27.9, -33.31], [-22.37, -35.89], [-16.48, -37.47], [-10.4, -38.0], [-4.32, -37.47], [1.57, -35.89], [7.1, -33.31], [12.1, -29.81], [16.41, -25.5], [19.91, -20.5], [22.49, -14.97], [24.07, -9.08], [24.6, -3.0]]}
    - {name: undercut_r_outer, material: air, polygon_um: [[-24.6, -3.0], [-24.07, -9.08], [-22.49, -14.97], [-19.91, -20.5], [-16.41, -25.5], [-12.1, -29.81], [-7.1, -33.31], [-1.57, -35.89], [4.32, -37.47], [10.4, -38.0], [16.48, -37.47], [22.37, -35.89], [27.9, -33.31], [32.9, -29.81], [37.21, -25.5], [40.71, -20.5], [43.29, -14.97], [44.87, -9.08], [45.4, -3.0]]}
    - {name: undercut_l_inner, material: air, polygon_um: [[-135.4, -3.0], [-134.87, -9.08], [-133.29, -14.97], [-130.71, -20.5], [-127.21, -25.5], [-122.9, -29.81], [-117.9, -33.31], [-112.37, -35.89], [-106.48, -37.47], [-100.4, -38.0], [-94.32, -37.47], [-88.43, -35.89], [-82.9, -33.31], [-77.9, -29.81], [-73.59, -25.5], [-70.09, -20.5], [-67.51, -14.97], [-65.93, -9.08], [-65.4, -3.0]]}
    - {name: undercut_l_outer, material: air, polygon_um: [[-156.2, -3.0], [-155.67, -9.08], [-154.09, -14.97], [-151.51, -20.5], [-148.01, -25.5], [-143.7, -29.81], [-138.7, -33.31], [-133.17, -35.89], [-127.28, -37.47], [-121.2, -38.0], [-115.12, -37.47], [-109.23, -35.89], [-103.7, -33.31], [-98.7, -29.81], [-94.39, -25.5], [-90.89, -20.5], [-88.31, -14.97], [-86.73, -9.08], [-86.2, -3.0]]}
  electrodes:
    - {name: signal, role: signal, weight: 1.0, rect: {x_um: [-92.9, -17.9], y_um: [1.1, 2.2]}, material: gold}
    - {name: ground_r, role: ground, weight: 0.0, rect: {x_um: [17.9, 92.9], y_um: [1.1, 2.2]}, material: gold}
    - {name: ground_l, role: ground, weight: 0.0, rect: {x_um: [-203.7, -128.7], y_um: [1.1, 2.2]}, material: gold}
    - {name: pad_r_signal_side, role: signal, weight: 1.0, rect: {x_um: [-2.9, -0.9], y_um: [1.1, 1.3]}, material: gold}
    - {name: pad_r_ground_side, role: ground, weight: 0.0, rect: {x_um: [0.9, 2.9], y_um: [1.1, 1.3]}, material: gold}
    - {name: pad_l_signal_side, role: signal, weight: 1.0, rect: {x_um: [-109.9, -107.9], y_um: [1.1, 1.3]}, material: gold}
    - {name: pad_l_ground_side, role: ground, weight: 0.0, rect: {x_um: [-113.7, -111.7], y_um: [1.1, 1.3]}, material: gold}
  optical_window: {x_um: [-4, 4], y_um: [-1.5, 1.5]}
  mesh: {max_edge_um: 2.0, electrode_edge_um: 0.05}
line:
  length_mm: 10
  conductor_loss_model: skin_effect_wheeler
  rf_loss_table: null
  source_ohm: 50
  load_ohm: 50
  differential: false              # single-ended probe on the centre signal line; push-pull is produced by the arm placement (see SPEC_PROPOSALS)
  loading:
    type: periodic_t_rail
    period_um: 50                  # r + c = 47 + 3; project_inference, see provenance
    loaded_length_um: 36           # hole-and-bar section (see provenance); remaining 14 um modelled with the unloaded cut
    unloaded_cross_section: unloaded
    loaded_cross_section: null     # null = top-level `geometry` (SPEC ambiguity, see SPEC_PROPOSALS)
sweep: {f_start_ghz: 0.1, f_stop_ghz: 110, n_points: 220}

alt_geometries:
  unloaded:                        # UNLOADED cut: same slots + undercut, T-bar pads absent (gap c between T-segments)
    symmetry: none
    domain: {x_um: [-300, 190], y_um: [-250, 120]}
    regions:
      - {name: ambient, material: air, rect: {x_um: [-300, 190], y_um: [-250, 120]}}
