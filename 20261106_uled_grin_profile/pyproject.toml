[project]
name = "grinopt"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cma>=4.5.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
ignore = ["E741"]  # l is the LP azimuthal order

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
