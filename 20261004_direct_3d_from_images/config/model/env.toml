# Environment (coordinator-owned): photo-textured mat plane and lighting. Helper objects ("_" prefix) render in
# RGB only; they are excluded from the ID pass, the fit loss and point distances.
[mat]
texture = "assets/textures/env_mat.png"   # from scripts/tools/texture_from_photos.py config/model/env_mat_texture_spec.json
z = -0.2          # mm, just below the model's z = 0 contacts
roughness = 0.7
