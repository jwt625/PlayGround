brown = [0.079, 0.062, 0.028, 0.5]  # Phase 3: scaled by photo/render median ratio (wires_301, probe)
blue = [0.018, 0.056, 0.156, 0.45]  # sRGB 36,67,110
white = [0.617, 0.561, 0.559, 0.5]  # Phase 3: scaled by photo/render median ratio (wires_301, probe)
board = [0.515, 0.223, 0.053, 0.6]  # sRGB 190,130,65 (mid-tone of the tan board in IMG_1629/1580; highlight 223,167,81)
