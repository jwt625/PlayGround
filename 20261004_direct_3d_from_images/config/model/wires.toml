board = [0.515, 0.223, 0.053, 0.6]  # sRGB 190,130,65 (mid-tone of the tan board in IMG_1629/1580; highlight 223,167,81)
pot = [0.68, 0.68, 0.61, 0.5]  # sRGB 215,215,205
cream = [0.644, 0.552, 0.342, 0.45]  # sRGB 210,196,158 (HV cable / grey-cable inner, IMG_1560)
