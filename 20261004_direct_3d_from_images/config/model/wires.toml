# wires group parameters (mm, world frame). Phase 1A rough block-out.
# Provenance: DevLog/parts/DevLog-002-wires.md (sparse colored points, tri2 picks, ray-plane picks, overlays).
# Wire paths: lists of [x, y, z] control points (smooth Bezier through them); r = tube radius.

[colors]            # linear RGB + roughness; from photo sRGB (IMG_1580, hue-masked medians along traces; pots/conn estimated)
