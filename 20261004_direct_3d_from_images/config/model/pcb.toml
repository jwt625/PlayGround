[mats]                # linear RGB, roughness. Base colors ~ photo colors of lit surfaces (sample.py on IMG_1560/1613,
board = [0.22, 0.12, 0.02, 0.6]          # sRGB 128,98,13 lit board (IMG_1560); top is textured anyway
beige = [0.86, 0.78, 0.62, 0.75]         # flyback paper, sRGB 240,229,205
black = [0.02, 0.02, 0.02, 0.55]         # black sleeves / plastic (rougher: less white sheen)
ferrite = [0.07, 0.08, 0.09, 0.8]        # choke tops sRGB 76,83,89
blue = [0.03, 0.13, 0.46, 0.35]          # blue sleeves
ceramic_blue = [0.03, 0.16, 0.51, 0.45]
metal = [0.72, 0.74, 0.74, 0.35]         # plate top sRGB 220,224,223
cap_top = [0.40, 0.42, 0.42, 0.45]     # vent tops read mid-grey silver in photos
white = [0.65, 0.62, 0.52, 0.5]          # JST nylon
green = [0.03, 0.10, 0.04, 0.4]
yellow = [0.45, 0.28, 0.02, 0.5]
trim_base = [0.02, 0.08, 0.40, 0.5]
trim_rotor = [0.70, 0.70, 0.65, 0.5]
leg = [0.70, 0.70, 0.72, 0.3]
fly_dark = [0.065, 0.063, 0.056, 0.6]

[metal_keys]
keys = ["metal", "cap_top", "leg"]
dielectric_specular = 0.25   # Specular IOR Level for non-metal photo-sampled materials (coordinator rig)

[textures]            # image textures (assets/textures), applied as quads; specs in outputs/scratch/pcb/tex_*.json
board_top = "assets/textures/pcb_board_top.png"       # z 6 plane, per-texel top-3 median, model-occlusion masked
flyback_top = "assets/textures/pcb_flyback_top.png"   # WARNING label, n_best 5 (IMG_1613,1622,1632,1562,1561)
flyback_side = "assets/textures/pcb_flyback_side_py.png"  # "SY-F100C NO." sticker on the +Y face, z 17..26.9

[flyback_side_label]  # +Y face (y = flyback.y1), TL TR BR BL seen from +Y
corners = [[87.2, -28.3, 26.9], [56.9, -28.3, 26.9], [56.9, -28.3, 17.0], [87.2, -28.3, 17.0]]

[cap_vent]            # silver top disc on electrolytics (not on chokes)
inset = 0.5           # radius inset
h = 0.3

[[legs]]              # TO-220 leads of reg_a, bent toward +X (IMG_1560 ortho z 17: leads at y 40.2, 43.1, x 37..40)
y = [40.2, 41.65, 43.1]
x = [36.5, 40.5]
z = 12.0
w = 0.8
t = 0.5

