y = -22.3
d = 3.8
top = 13.5
mat = "black"
vent = false

[[cap]]
name = "capK_n"       # black cap with silver top between choke_a and choke_b (orphan cluster (75.6,20.9,19.7) n 20 in pcb_010);
x = 76.0              # sparse x 72-79, y 19-24, z90 21
y = 21.3
d = 6.3
top = 21.0
mat = "black"

# Axial parts lying on the board / horizontal parts: center (mm), axis x|y, body radius/length, total lead length.
[[axial]]
name = "hv_boot"      # black rubber boot of the HV cable leaving the flyback -X face; sparse x 50-58, y -48.7..-42.2, z med 22.6
center = [55.2, -45.5, 22.6]   # fit dx +1.7 accepted; fit dy -2.25 rejected (sparse y median -44.7)
axis = "x"
r = 2.8
len = 7.0
lead_len = 0.0
mat = "black"

[[axial]]
name = "diode_a"      # black glass diode, sparse x 53-58.8, y -24.4..-25.7, z 7-10
center = [56.0, -24.9, 7.8]
axis = "x"
r = 1.1
len = 4.2
lead_len = 9.0
mat = "black"

[[axial]]
name = "res_green"    # green banded axial part, ortho z 8 (23.6-26.8, -30..-35.4); sparse z 7-12
center = [25.2, -32.6, 8.5]
axis = "y"
r = 1.7
len = 5.5
lead_len = 9.0
mat = "green"

