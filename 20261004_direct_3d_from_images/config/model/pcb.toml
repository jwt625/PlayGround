# pcb group parameters (mm, world frame). Phase 1A rough block-out.
# Provenance: DevLog/parts/DevLog-002-pcb.md. Sparse-point clusters (COLMAP points in world frame), pick.py tri,
# and IMG_1560 orthophotos at z = 6 / 17 / 27 (pixel rays intersected with a plane).

[board]               # tan/brown main PCB; top surface from tri on 3 board points (5.6-6.4) + brown sparse pts (5.9)
x0 = 1.5
x1 = 96.3
y0 = -48.0
y1 = 47.0
top = 6.0
thick = 1.6

[flyback]             # boxed HV transformer; top from sparse points (z median 26.8) and coordinator tri (26.7-27.1)
x0 = 56.9
x1 = 87.2
y0 = -49.2
y1 = -28.3
top = 26.9
end_t = 0.0           # (was 0.8 black end faces; whole body now dark)
body_mat = "fly_dark" # sides are dark grey core/bobbin: IMG_1613 band below the -Y top edge sRGB 72,71,67;
                      # top and +Y sticker are textured quads; -Y face is hidden by the case wall except z > 24
base_h = 3.0          # black base strip at the bottom (z = board top .. +base_h)

[flyback_label]       # textured quad on the flyback top. Corners TL, TR, BR, BL (coordinator)
corners = [[86.07, -47.55, 26.9], [57.11, -48.99, 26.9], [56.88, -28.58, 26.9], [85.92, -28.28, 26.9]]

[plate]               # vertical aluminium heat-sink plate along the +Y wall; top edge tri (28.0-28.7) at y 48-49
chamfer_dx = 2.0      # -X top corner cut (IMG_1626 / IMG_1560 ortho z 28: plate starts at x 12.5 with a cut corner)
chamfer_dz = 2.0
flange_y0 = 46.0      # top flange (L-bracket) toward -Y: sparse pts z 26-30 concentrate at y 46-48.5; IMG_1626 lit band
flange_t = 1.2
x0 = 12.5
x1 = 95.0
y0 = 46.8
y1 = 48.3
top = 28.4

# Rectangular parts: [x0, x1, y0, y1] and top z, bottom on the board top. mat: key into the mats table.
[[block]]
name = "black_block"  # black plastic block "8XSZ" in front of the plate, +X end
xy = [64.0, 91.6, 38.2, 46.8]
top = 21.0
mat = "black"

[[block]]
name = "reg_a"        # black TO-220 body near the plate, sparse z median 13
xy = [29.0, 37.0, 41.0, 46.5]
top = 13.5
mat = "black"

[[block]]
name = "reg_b"        # TO-220 with metal tab and screw
xy = [21.8, 28.0, 41.0, 46.5]
top = 11.5
mat = "metal"

[[block]]
name = "conn_a"       # white vertical 4-pin JST header at the +X end
xy = [86.5, 93.7, 24.2, 36.5]
top = 15.5
mat = "white"

[[block]]
name = "conn_b"       # white 5-pin JST header along the -Y wall
xy = [10.5, 24.9, -47.9, -40.5]
top = 15.0
mat = "white"

[[block]]
name = "conn_c"       # white header under the wire bundle near the blue cap
xy = [47.0, 60.0, 33.5, 37.5]
top = 13.0
mat = "white"

[[block]]
name = "film_a"       # green film caps
xy = [41.9, 46.4, 30.6, 33.6]
top = 17.0            # green sparse pts z 15.7-17.7
mat = "green"

[[block]]
name = "film_b"       # fit_params dx +1.4 dy +1.25 (pcb_film_b)
xy = [43.4, 47.9, 26.25, 29.25]
top = 16.5
mat = "green"

[[block]]
name = "film_y"       # yellow box capacitor
xy = [80.5, 86.0, 23.0, 27.0]
top = 19.0
mat = "yellow"

[[block]]
name = "white_part"   # white round part near the flyback (under the white cable); orphan cluster (45.3,-32.5,13.8)
xy = [42.25, 48.25, -34.05, -27.05]
top = 15.0
mat = "white"

[[block]]
name = "cer_a"        # blue ceramic disc caps (standing, faces along X)
xy = [49.5, 51.5, -35.5, -29.0]
top = 13.0
mat = "ceramic_blue"

[[block]]
name = "cer_b"
xy = [52.5, 54.5, -36.0, -29.5]
top = 13.0
mat = "ceramic_blue"

[[block]]
name = "cer_c"        # blue sparse pts (65.6-67.5, -19.4, z 12.7-15); fit's dx -3.75 rejected (contradicts points)
xy = [62.0, 68.5, -20.0, -17.0]
top = 15.0
mat = "ceramic_blue"

[[block]]
name = "dark_small"   # unlabeled dark part, sparse cluster (67-71, -15..-13, z 8-12.6)
xy = [66.5, 71.5, -15.5, -12.5]
top = 12.0
mat = "black"

[[slab]]
name = "reg_tab"      # inclined metal heat tab in front of the regulators: tri IMG_1626 (23.5,36.5,21.8) 5 inliers,
center = [28.5, 36.3, 20.0]   # (33.1,34.7,19.2); sparse y-z profile rises z 17 -> 24 over y 33.5 -> 38
size = [14.0, 8.0, 1.5]
rot_x_deg = 50.0
mat = "metal"

[fit]                 # per-part offsets for fit_params (scalar keys); accepted values get folded into the lists, then reset to 0
cer_c_dx = 0.0
cer_c_dy = 0.0
film_a_dx = 0.0
film_a_dy = 0.0
film_b_dx = 0.0
film_b_dy = 0.0
white_part_dx = 0.0
white_part_dy = 0.0
capB_i_dx = 0.0
capB_i_dy = 0.0
trim_6_dx = 0.0
trim_6_dy = 0.0
ic_a_dx = 0.0
ic_a_dy = 0.0
hv_boot_dx = 0.0
hv_boot_dy = 0.0
hv_boot_dz = 0.0
conn_b_dx = 0.0
conn_b_dy = 0.0
choke_c_dx = 0.0
choke_c_dy = 0.0

# Phase 1C small parts (IMG_1560 ortho z 8 at 14 px/mm + sparse-point boxes; DevLog-002-pcb)
[[block]]
name = "ic_a"         # DIP-8 under the green film caps: tri IMG_1626 (39.6,21.1,8.9); sparse x 37-43.6, y 20-24.2
xy = [36.5, 44.5, 20.0, 24.4]
top = 9.3
mat = "black"

[[cap]]
name = "q_a"          # small black standing part (TO-92 / small cap), sparse (60.5-63.1, -21.8..-21.1), z to 14.2
