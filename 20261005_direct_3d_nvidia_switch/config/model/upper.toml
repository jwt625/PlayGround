# Rear UQD fittings (Wave 2, 2026-10-06): per side two UQD bodies along +Y stacked in Z (not side by side in X):
# upper body A at Z +14 (+X), lower body B about 43 mm below (image offset A->B in IMG_5741 solved with the
# per-axis image Jacobian: dX -0.5, dY +2, dZ -43 mm). Body A collar/O-ring at (200, 853, 14) from two rays
# (IMG_5741 and IMG_5754 at X = 185/205 intersect within 2.4 mm in Z at X 200). Visible black body length about
# 20-25 mm (IMG_5742 -X side, ends against the background; 30 mm overshot there). Silver block between the bracket and body A
# (IMG_5741, about 26 mm along Y); black block holding body B. -X side mirrored, Z 6 mm lower (0.85 deg roll;
# overlays IMG_5741/5742/5754 agree). Old bracket boxes over the rear lip kept (pts median 1.8 mm).
