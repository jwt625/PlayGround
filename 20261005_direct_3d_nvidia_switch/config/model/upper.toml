# Upper group: middle bay (Y 370-595), rear bay (Y 605-776), rear UQD fittings, copper tubes down to Y = 350.
# mm, tray frame (X width, Y front -> rear, Z out of the open top; Z = 0 crossbar top).
# Provenance: DevLog/parts/DevLog-002-upper.md (sparse-point height modes per region, orthophotos of train
# views IMG_5713/5748/5749/5753 on planes z = const, overlays). Phase 1A block-out: boxes, prisms, tubes.
#
# Entry types (one Blender object per entry, named "upper.<name>"):
#   [[box]]   b = [x0, x1, y0, y1, z0, z1], mat, optional bevel
#   [[prism]] pts = [[x, y], ...] (outline, any winding), z = [z0, z1], mat
#   [[cyl]]   c = [x, y, z] center, r, h, axis ("x"|"y"|"z"), mat
#   [[tube]]  pts = [[x, y, z], ...] polyline, r, fillet (corner radius), mat
#   [[cyls]]  repeated vertical cylinders: xy = [[x, y], ...], r, z = [z0, z1], mat (one object)

[mats]  # sRGB 0-255 (converted to linear in build.py), roughness, metallic. Photo medians, lit patches.
nickel = [125, 120, 104, 0.45, 0.6]     # serpentine / board plates (IMG_5749 lit patch 121,115,95)
steel = [175, 175, 168, 0.35, 0.7]      # ASIC cold plate, clamp
copper = [185, 110, 75, 0.35, 0.8]      # tubes, blocks (lit tube pixels)
pcb = [34, 37, 37, 0.5, 0.0]            # black boards
baffle = [28, 30, 31, 0.6, 0.0]         # black plastic baffles (IMG_5749 23,26,25)
hose = [30, 31, 30, 0.7, 0.0]           # black hoses, UQD bodies
alu = [175, 172, 160, 0.4, 0.6]         # aluminum fitting blocks
blue = [60, 100, 170, 0.5, 0.0]         # blue wire bundles
ribbon = [62, 64, 63, 0.7, 0.0]         # flat ribbon cable (IMG_5749 70,72,71)
cap = [35, 35, 36, 0.4, 0.0]            # electrolytic capacitor sleeves
conn = [20, 22, 22, 0.5, 0.0]           # black connectors
chrome = [200, 200, 196, 0.2, 1.0]       # (Wave 6 first try for collars: too bright; kept for reference)
collar = [120, 118, 112, 0.3, 0.8]      # UQD collars and nut, darker metal (Wave 6 second try)
oring = [170, 45, 45, 0.5, 0.0]         # red O-ring (IMG_5741 crop color, Wave 6)
teal = [29, 33, 36, 0.8, 0.0]           # braided teal cable near the crossbar: median of its pixels in 6 probe views (29,33,34)

