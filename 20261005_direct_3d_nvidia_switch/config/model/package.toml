# Package group (Spectrum-6 CPO package + post stand). mm, package frame (config/frames.json) after the
# correction below. Corrected frame: origin = center of the substrate top face, X/Y along the stiffener edges,
# Z out of the package top. Measurements: DevLog/parts/DevLog-002-package.md (package agent, 2026-10-05).

[frame_correction]   # applied in the package frame before lib.apply_frame (local = R(rot) @ p + translate)
translate_mm = [0.0, 0.0, 0.0]      # was [-4.0, -3.1, -0.7]; folded into config/frames.json by the coordinator 2026-10-05
rotate_deg = [0.0, 0.0, 0.0]        # ring top tilt < 0.4 deg, in-plane < 0.3 deg: none applied

specular = 0.25   # Specular IOR Level for all flat materials (matte photo-sampled rule)
stand_specular = 0.25   # stand material only (hook for a test; lower values not tested yet)

[colors]   # linear base colors, photo-sampled medians (IMG_5711/5712/5717)
ring = [0.58, 0.55, 0.46]
substrate = [0.02, 0.04, 0.045]
field = [0.21, 0.41, 0.49]
oe = [0.39, 0.33, 0.20]
chip = [0.12, 0.12, 0.11]
lid = [0.22, 0.21, 0.18]
stand = [0.03, 0.03, 0.035]

[texture]   # planar photo texture over the substrate square on all up-facing package faces (bake_top.py)
top = "assets/textures/package_top20m_p25.png"   # 20 px/mm from the originals, views affine-aligned to their median (align_top.py); 10 px/mm: package_top_p25.png
sides = "assets/textures/package_side_p25.png"   # outer walls of ring + substrate (bake_top.py --sides, IMG_5712/5717)
walls = "assets/textures/package_walls_p50.png"   # near-vertical inner faces (ring, field, OEs, lid): bake_walls.py
walls_ppm = 20.0
walls_skip = ["oe_chip"]   # chip sides: leave-one-out on 5717/5712 worse than flat (chip_bottom 35.2 -> 43.0)
roughness = 0.5
min_nz = 0.9

[substrate]
size_x = 108.3     # ring/substrate outer edges coincide within 0.5 mm; analyst 110 (check only)
size_y = 107.8
thickness = 2.5    # not observable (underside hidden); assumption

[ring]   # silver stiffener ring on the substrate: raised outer rim + raised corner blocks, lower inner lips
top = 2.7          # rim and corner-block top above substrate top (edge agreement + NCC on the QR label)
lip_top = 1.3      # inner lips between the corner blocks (NCC 1.0-1.25 on the bands; 1B)
rim_x = 51.0       # lips span inner_x..rim_x (left/right) and inner_y..rim_y (top/bottom); step lines in the
rim_y = 52.4       #   0.06 mm/px orthos (x -50.7 / +51.4, y -52.35)
notch = 10.2       # square corner notches (substrate visible)
inner_x = 45.1     # half-width of the opening at the left/right OE columns
inner_y = 48.25    # half-height of the opening at the top/bottom OE rows
r_notch = 1.5       # notch inner corner radius (0.06 mm/px ortho, about 25 px) (Phase 2)
r_block = 1.4       # corner-block convex corner radius into the opening
r_open = 0.5        # opening corners at the lips
corner_block = 34.7  # ring corner blocks fill |x| > this and |y| > this inside the opening (0.06 mm/px ortho)

[field]   # light-blue substrate surface inside the ring opening (bump/cap field, NCC 0.25)
thickness = 0.2
caps = "scripts/model/package/caps.json"   # component rectangles from the top texture (measure/caps.py, delta 25)
cap_height = 0.0    # relief 0.35 tested (package_011/012): pts 0.199 -> 0.177 mm but SSIM 0.635 -> 0.622, edge 1.48 -> 1.52 px; texture only kept
cap_side = "field"  # side-face material key (chip or field)

[oe]   # optical engines: 8 per side, 32 total; gold fiber bracket (outer) + gray chip with QR (inner)
count = 8
pitch = 7.88       # autocorrelation along all 4 sides, 2 views: 7.86-7.91
gold_width = 6.9   # along the side
chip_width = 7.4
gold_height = 1.3  # NCC on brackets 1.25 (6 patches)
chip_height = 0.85 # NCC on chips 0.75-1.0
rows_chip_r = [34.0, 39.2]   # top/bottom rows: radial extent from the package center (0.06 mm/px orthos)
rows_gold_r = [39.2, 45.7]
cols_chip_r = [31.8, 36.6]   # left/right columns
cols_gold_r = [36.6, 42.6]

[lid]   # outer edge of the gray lid surface (0.05 mm/px ortho anaglyph IMG_5711 x 5712 at z = 0.3)
size_x = 49.5
size_y = 54.0
cx = -1.0
cy = 0.35
height = 0.9        # NCC 0.75-1.0 (1B)

[stand]   # black display stand; underside never seen (fake solid back plate)
back_size = 100.0
back_thickness = 4.0
ledge = [-2.5, 56.5, -4.0]     # center of the ledge under the package +Y edge (gravity bottom); bar X -28..23 (IMG_5740), -33..23 (IMG_5711)
ledge_size = [51.0, 4.0, 10.0]
ledge_y = 54.5                 # scalar overrides of ledge[1], ledge[2], ledge_size[1], ledge_size[2]: fit_params
ledge_z = -7.1                 #   (outputs/fits/package_ledge1, IMG_5711/5712/5717/5740, edge 4.71 -> 2.19 px at 50 pct)
ledge_t = 3.0                  #   from 56.5 / -4.0 / 4.0 / 10.0 (80-eval pattern search; not re-fit from other starts)
ledge_h = 8.0
ledge_r = 1.49                 # rounded (stadium) ends in the package plane: IMG_5711/5712/5717 overlays (Wave v4)
rod_r = 2.75                   # 25 px (1/4 scale) at about 230 mm in IMG_5717
rod_p0 = [4.5, 24.4, -6.5]     # v4 wave: rod runs from the panel to the back plate (hidden behind the package);
                               #   line fit to IMG_5740 (vertical band u 962 s2) + IMG_5717 (v 932), p0 at z -6.5;
                               #   old (-9, 59, -10) "end-on in 5711" made the rod diagonal in 5740
rod_p1 = [-3.5, 73.0, -54.2]   # on the panel front face (moved in-plane 3.7 mm); 5711 blob at s2 (2030, 1040) vs 2052, 1042
panel_fl = [-40.7, 96.4, -29.5]   # inclined back panel (easel back), front-face corners; 7-parameter fit
panel_fr = [36.7, 102.8, -36.0]   #   (yaw, shift, size, 2 tilts) to 13 outline points in IMG_5711/5712:
panel_bl = [-39.7, 29.4, -84.5]   #   rms 5.1 px vs 21.5 px for a horizontal plate; 33 deg from horizontal
panel_r = 7.0                     # panel corner radius (rounded corners in all three views)
panel_thickness = 5.0             # front face band in IMG_5711 (about 5 mm); no post (rod ends on the panel)
panel_dx = 0.0      # Wave 2 adjustments of the fitted panel: shift along its width axis (mm),
panel_df = 0.0      #   along its depth axis toward the front edge, along its normal,
panel_dz = 0.0
panel_dw = 0.0      #   width and depth changes (front edge fixed), in-plane yaw (deg)
panel_dd = 0.0
panel_yaw = 0.0
