[project]
name = "direct-3d-nvidia-switch"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
 "opencv-python-headless",
 "scipy",
 "pillow",
 "pyyaml",
 "numba>=0.68.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[dependency-groups]
seg = [
    "hydra-core>=1.3.7",
    "iopath>=0.1.10",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "tqdm>=4.70.1",
]

[tool.uv]
default-groups = ["seg"]   # SAM 2 masks (torch from the uv cache; sam2 source used in place from ~/Documents/GitHub/sam2)
