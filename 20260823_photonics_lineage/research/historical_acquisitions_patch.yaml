method_notes:
  - "Announcement headline values, per-share terms, and closing-date accounting consideration are preserved separately in event notes when their measurement bases differ."
  - "Employee integration is recorded only when an issuer explicitly states it; assumed or converted employee equity awards do not by themselves prove continued employment."
  - "II-VI is modeled as Finisar's 2019 acquirer. Coherent Corp. is a later corporate successor and is not substituted retroactively as the transaction counterparty."
  - "No team_transfer edges are created. Corporate acquisition and explicit workforce-integration language remain separate claims."

