dataset:
  title: "China optical-component incumbents: initial named-person tranche"
  version: "0.1"
  as_of: "2026-08-23"
  scope: >-
    Named founders and technically relevant leaders at InnoLight, Eoptolink, Accelink,
    Source Photonics, Broadex, and Hisense Broadband, with individually evidenced
    antecedents. This is a staging file; it does not assert cohort or team transfers.
  evidence_policy:
    A: "Primary artifact: regulatory filing, issuer annual report, primary paper, or official company biography."
    B: "Professional-society biography, authoritative technical interview, or reputable event-host biography."
    X: "Generic team-origin statement or inference; discovery only and not an edge."
  integration_note: >-
    IDs are local staging IDs. Canonical integration must prefix IDs, normalize legal
    entities, and convert source_urls into claim-level source references.

