dataset:
  title: UCSB / John Bowers lineage — initial evidence-backed tranche
  as_of: "2026-08-23"
  scope: Bowers-group alumni and technical leaders across Aurrion, Juniper, Quintessent, Nexus Photonics, Aerius Photonics, Terabit Technology, and Calient.
  status: initial_research
  default_graph_filter: [A, B]
  notes:
    - Seed inclusion is not evidence; only the atomic edges below are proposed for graph ingestion.
    - UCSB attendance is distinct from Bowers-group research training.
    - Aurrion employment is distinct from Aurrion founder status.
    - Null dates mean the reviewed source did not support a reliable boundary.

