dataset:
  title: "Intel Silicon Photonics people: initial evidence-backed seed tranche"
  version: "0.1"
  as_of: "2026-08-23"
  scope: >-
    Named people with direct evidence of Intel silicon-photonics work, plus selected
    downstream career edges. This is a seed file, not a complete employment history.
  evidence_policy:
    A: "Primary or official: employer/company bio, professional-society page, conference bio, paper affiliation, or official press release."
    B: "Strong independent secondary source."
    C: "Self-reported or aggregator evidence; excluded from the default validated graph."
    X: "Inference; not used for validated edges."
  default_graph_filter: [A, B]
  integration_note: >-
    Person keys and source keys in this isolated workstream file are local staging IDs.
    Canonical merge must add the schema-required person_, org_, edge_, and src_ prefixes
    and convert source_urls into claim-level source references.

