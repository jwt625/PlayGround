dataset:
  title: "China photonics / Huawei / overseas-returnee ecosystem: initial named-person tranche"
  version: "0.1"
  as_of: "2026-08-23"
  scope: >-
    Named founders and technical leaders at LightIC, Inxun, NVISION (Yingweixin),
    Liangyin, Aluksen (Aoke), Beeplux (Bopu), Huawei, and HiSilicon Optoelectronics.
    This staging file records only atomic claims directly supported by the cited artifact.
  evidence_policy:
    A: "Primary: official company/university page, government or IP artifact, official filing, or official conference bio/program."
    B: "Strong secondary: authoritative interview, professional society, or reputable technical/industry publication."
    C: "Database or directory; discovery only unless corroborated."
    D: "Promotional or general-news claim; excluded from validated edges."
    X: "Inference or generic team-origin claim; never a validated person edge."
  integration_note: >-
    IDs are local staging IDs. Canonical integration must add schema prefixes and
    convert source_urls into claim-level source references. Romanizations marked
    researcher_supplied must not be used alone for identity merges.

