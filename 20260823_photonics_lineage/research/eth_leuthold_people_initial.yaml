asserted_non_edges:
  - {claim: "Polariton is a thin-film lithium-niobate company", status: rejected, rationale: "Reviewed ETH, Polariton, and Marvell sources describe plasmonic active devices combined with silicon-photonics platforms; none supports a TFLN core-technology classification."}
  - {claim: "All Polariton personnel transferred to Marvell on 2026-04-22", status: rejected, rationale: "Marvell refers generically to adding a team with silicon-photonics expertise but names no transferred people; no team_transfer or person-level Marvell edge is created."}
  - {claim: "Nicholas Güsken trained in Leuthold's ETH group", status: rejected, rationale: "The reviewed professional-society listing supports only a Polariton engineering role."}
  - {claim: "Qian Hu moved from Nokia Bell Labs to Polariton", status: rejected, rationale: "The source establishes a joint trial and Nokia Bell Labs principal-investigator role, not employment migration."}
  - {claim: "Valery Shklover was a member of Leuthold's IEF group", status: rejected, rationale: "The project source places Shklover at ETH and collaborating on a Leuthold-led project, but not inside IEF; the edge terminates at ETH Zurich."}
