unresolved_conflicts:
  - subject: person_mario_paniccia
    issue: >-
      ANELLO's profile dates the CEO/chairman appointment to November 2019, while
      its interview says he started ANELLO in 2020. These can describe appointment
      versus operating launch, but neither is asserted here as a legal incorporation date.
  - subject: org_aurrion
    issue: >-
      UCSB's current technology-transfer page says Aurrion was founded in 2008,
      while an older CONNECT/San Diego company fact sheet reproduced online reports
      2007. No A/B artifact found in this pass resolves the month or the year conflict.
