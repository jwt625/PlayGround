source_defect: >-
  PDF text layer is font-encoded garbage; text.md was later replaced by tesseract OCR of the 220 dpi renders. Every
  value here was read from page renders of source.pdf (200 dpi full pages, page 4 at 400 dpi for Fig. 6), equivalent
  to the 220 dpi renders; the OCR text was used only as a cross-check.
figure_reading_method: >-
  Fig. 6(a) and 6(c) read by pixel calibration against gridlines of a 400 dpi page-4 render (about 90 px/mm and
  1118 px per pJ/bit). Fig. 6(b) has no y tick values, so only the text thresholds (~20, ~30 um) are entered.
  Fig. 4(b) stacked bars have no axis values.
