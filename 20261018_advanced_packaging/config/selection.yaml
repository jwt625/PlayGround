# Selection rules (from init-prompt.md; cap from 2026-10-18 answer)
threshold: 7
floor_n: 10
floor_orgs: 3
floor_years: 3
floor_min_score: 5
cap: 300
# Spec "cache regardless of score" list (init-prompt.md). Curator mandatory/out_of_window entries whose tech text
# matches spec_mandatory_re (and not spec_mandatory_exclude_re) are protected; other curator "mandatory" items become
# rank-0 priority-1 picks (compete under the cap); other out_of_window items are reported as references, not cached.
spec_mandatory_re: 'CoWoS|InFO[-_ ]?oS|InFO[-_ ]?LSI|SoIC|\bEMIB\b|Foveros|\bODI\b|I-Cube|X-Cube|H-Cube|SK hynix HBM3E|SK hynix HBM4|HBM3E stack|HBM4 stack|Absolics|SKC|Intel glass core|FOPLP line|\b(5[0-9]{2}|6[0-9]{2}|7[0-9]{2}) ?(mm)? ?x ?(5[0-9]{2}|6[0-9]{2}|7[0-9]{2}) ?mm'
spec_mandatory_exclude_re: 'COUPE|CPO|cooling|context|MI300'
# Cap drop order uses effective score = LLM score + pick_bonus (curator pick) + priority1_bonus (curator priority 1).
pick_bonus: 1
priority1_bonus: 1
lineage_max: 10
