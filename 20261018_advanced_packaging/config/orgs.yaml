# Canonical organization names and affiliation-string regexes (case-insensitive).
# priority: true = in the spec's weighted list (first-party industrial / institute / vendor).
# kind: foundry_osat | idm | memory | institute | university_center | vendor | other
orgs:
  TSMC: {re: 'TSMC|Taiwan Semiconductor Manufacturing', kind: foundry_osat, priority: true}
  Intel: {re: '\bIntel\b', kind: idm, priority: true}
  Samsung: {re: 'Samsung', kind: idm, priority: true}
  SK hynix: {re: 'SK ?hynix', kind: memory, priority: true}
  Micron: {re: '(?<!Uni)(?<!HANA )(?<!Hana )\bMicron\b', kind: memory, priority: true}
  ASE/SPIL: {re: '\bASE\b|Advanced Semiconductor Engineering|\bSPIL\b|Siliconware', kind: foundry_osat, priority: true}
  Amkor: {re: 'Amkor', kind: foundry_osat, priority: true}
  JCET: {re: 'JCET|Jiangsu Changjiang|STATS ChipPAC', kind: foundry_osat, priority: true}
  Powertech: {re: 'Powertech|\bPTI\b', kind: foundry_osat, priority: true}
  imec: {re: '\bimec\b|IMEC', kind: institute, priority: true}
  Fraunhofer IZM: {re: 'Fraunhofer', kind: institute, priority: true}
  ITRI: {re: '\bITRI\b|Industrial Technology Research Institute', kind: institute, priority: true}
  A*STAR IME: {re: 'A\*STAR|Institute of Microelectronics.{0,60}Singapore|Singapore.{0,60}Institute of Microelectronics|\bIME\b(?!.{0,40}Chinese)', kind: institute, priority: true}
  CAS IME: {re: 'Institute of Microelectronics.{0,40}Chinese Academy|Chinese Academy of Sciences.{0,40}Institute of Microelectronics', kind: institute, priority: false}
  CEA-Leti: {re: 'CEA|Leti', kind: institute, priority: true}
  Georgia Tech PRC: {re: 'Georgia Institute of Technology|Georgia Tech', kind: university_center, priority: true}
  Applied Materials: {re: 'Applied Materials', kind: vendor, priority: true}
  Lam Research: {re: 'Lam Research', kind: vendor, priority: true}
  BESI: {re: '\bBESI\b|BE Semiconductor', kind: vendor, priority: true}
